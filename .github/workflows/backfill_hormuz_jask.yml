name: Backfill — Hormuz corridor + Jask monitor (2025-01 → today)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      job:
        description: "Which job: hormuz_corridor | jask_monitor | both"
        required: false
        default: "both"

jobs:

  hormuz_corridor_backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (inputs.job || 'both') == 'both' ||
      (inputs.job || 'both') == 'hormuz_corridor'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Backfill
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/hormuz_corridor_detect.py --backfill ${{ inputs.from_date || '2025-01-01' }}

      - name: Write to DB
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/hormuz_corridor_detect.py --write-db

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-corridor-backfill
          path: diagnostics/hormuz_corridor_ships.csv
          retention-days: 30

      - name: Upload JSONL checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-corridor-jsonl
          path: diagnostics/hormuz_corridor_ships.jsonl
          retention-days: 30

  jask_monitor_backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (inputs.job || 'both') == 'both' ||
      (inputs.job || 'both') == 'jask_monitor'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Backfill
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/jask_ship_detect.py --backfill ${{ inputs.from_date || '2025-01-01' }}

      - name: Write to DB
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/jask_ship_detect.py --write-db

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jask-monitor-backfill
          path: diagnostics/jask_ship_obs.csv
          retention-days: 30

      - name: Upload JSONL checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jask-monitor-jsonl
          path: diagnostics/jask_ship_obs.jsonl
          retention-days: 30
