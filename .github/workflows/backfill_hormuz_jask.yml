name: Backfill — Hormuz corridor + Jask monitor (2025-01 → today)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      job:
        description: "Which job: hormuz_corridor | jask_monitor | both | cleanup_jask | debug_dates | test5"
        required: false
        default: "both"
      debug_date:
        description: "Date for debug_dates job (YYYY-MM-DD)"
        required: false
        default: ""

jobs:

  hormuz_corridor_backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (inputs.job || 'both') == 'both' ||
      (inputs.job || 'both') == 'hormuz_corridor'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Backfill
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/hormuz_corridor_detect.py --backfill ${{ inputs.from_date || '2025-01-01' }}

      - name: Print CSV
        if: always()
        run: |
          echo "=== CORRIDOR CSV ==="
          cat diagnostics/hormuz_corridor_ships.csv 2>/dev/null || echo "(no CSV)"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-corridor-backfill
          path: diagnostics/hormuz_corridor_ships.csv
          retention-days: 30

      - name: Upload JSONL checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-corridor-jsonl
          path: diagnostics/hormuz_corridor_ships.jsonl
          retention-days: 30

  jask_monitor_backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (inputs.job || 'both') == 'both' ||
      (inputs.job || 'both') == 'jask_monitor'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Backfill
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/jask_ship_detect.py --backfill ${{ inputs.from_date || '2025-01-01' }}

      - name: Print CSV
        if: always()
        run: |
          echo "=== JASK CSV ==="
          cat diagnostics/jask_ship_obs.csv 2>/dev/null || echo "(no CSV)"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jask-monitor-backfill
          path: diagnostics/jask_ship_obs.csv
          retention-days: 30

      - name: Upload JSONL checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jask-monitor-jsonl
          path: diagnostics/jask_ship_obs.jsonl
          retention-days: 30

  debug_dates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (inputs.job || 'both') == 'debug_dates'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Debug corridor
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          python scripts/hormuz_corridor_detect.py --debug-date ${{ inputs.debug_date }}

      - name: Debug jask
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          python scripts/jask_ship_detect.py --debug-date ${{ inputs.debug_date }}

  test5_corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (inputs.job || 'both') == 'test5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Test 5 dates — Corridor
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          python scripts/hormuz_corridor_detect.py \
            --dates 2025-08-03,2026-01-24,2026-10-13,2026-10-25,2026-11-06

      - name: Print CSV
        if: always()
        run: |
          echo "=== CORRIDOR TEST5 CSV ==="
          cat diagnostics/hormuz_corridor_ships.csv 2>/dev/null || echo "(no CSV)"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test5-corridor-csv
          path: diagnostics/hormuz_corridor_ships.csv
          retention-days: 7

  test5_jask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (inputs.job || 'both') == 'test5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pystac-client planetary-computer \
            rasterio scipy numpy shapely fiona \
            requests \
            --quiet

      - name: Test 5 dates — Jask
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          python scripts/jask_ship_detect.py \
            --dates 2026-09-25,2026-10-07,2026-10-13,2026-10-19,2026-11-12

      - name: Print CSV
        if: always()
        run: |
          echo "=== JASK TEST5 CSV ==="
          cat diagnostics/jask_ship_obs.csv 2>/dev/null || echo "(no CSV)"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test5-jask-csv
          path: diagnostics/jask_ship_obs.csv
          retention-days: 7

  jask_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: (inputs.job || 'both') == 'cleanup_jask'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy scipy --quiet

      - name: Delete Jask rows from DB
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/jask_ship_detect.py --delete-db
