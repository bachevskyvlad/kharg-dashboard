name: Tank Patterns — Kharg interpretation layer

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install supabase pandas numpy
      - name: Run analysis
        run: python analysis/kharg_patterns/analyze_patterns.py
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kharg-patterns
          path: analysis/kharg_patterns/*.csv
      - name: Commit results
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add analysis/kharg_patterns/RESULTS.md analysis/kharg_patterns/*.csv || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "tank patterns: analysis results $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin main
          git push
