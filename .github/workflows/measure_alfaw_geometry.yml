name: Al-Faw Geometry v2 (Esri z18 + 16-ray)

on:
  workflow_dispatch:
    inputs: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy Pillow requests scipy -q

      - name: Run geometry measurement
        run: |
          mkdir -p diagnostics/al_faw/geometry
          cd scripts
          python measure_alfaw_geometry.py 2>&1 | tee ../diagnostics/al_faw/geometry/run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/geometry/ || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: alfaw geometry v2 outputs [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload geometry outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfaw-geometry-v2
          path: |
            diagnostics/al_faw/geometry/
