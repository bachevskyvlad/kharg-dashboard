name: Terminal health checks — Block B

on:
  workflow_dispatch:
    inputs:
      terminal:
        description: "Terminal ID (yanbu / ras_tanura / jask / …)"
        required: true
        default: "yanbu"
      checks:
        description: "Comma-separated check IDs (default: all)"
        required: false
        default: "C11,C04,C05,C06,C07,C14,C15,C16,C12"
      orbit:
        description: "Filter by relative orbit (leave blank for all)"
        required: false
        default: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase requests -q

      - name: Run checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ORBIT_ARG=""
          if [ -n "${{ github.event.inputs.orbit }}" ]; then
            ORBIT_ARG="--orbit ${{ github.event.inputs.orbit }}"
          fi
          mkdir -p diagnostics/checks
          cd scripts
          python terminal_checks.py \
            --terminal "${{ github.event.inputs.terminal }}" \
            --checks "${{ github.event.inputs.checks }}" \
            $ORBIT_ARG \
            2>&1 | tee ../diagnostics/checks/run_${{ github.event.inputs.terminal }}.txt

      - name: Save results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/checks/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: terminal-checks ${{ github.event.inputs.terminal }} [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true
