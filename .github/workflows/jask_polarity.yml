name: Jask — Polarity Check

on:
  workflow_dispatch:

jobs:
  jask_polarity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase -q

      - name: Run polarity check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/jask
          cd scripts
          python jask_polarity.py 2>&1 | tee ../diagnostics/jask/jask_polarity_run.txt

      - name: Save outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/jask/JASK_POLARITY.md      || true
          git add -f diagnostics/jask/jask_polarity.json    || true
          git add -f diagnostics/jask/jask_polarity_run.txt || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: jask polarity check [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
