name: Stage 6 — S2 Optical Shadow Pilot

on:
  workflow_dispatch:
    inputs: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas numpy requests Pillow scipy sentinelhub -q

      - name: Check secrets
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "CLIENT_ID set:     $([ -n "$CLIENT_ID" ]     && echo YES || echo MISSING)"
          echo "CLIENT_SECRET set: $([ -n "$CLIENT_SECRET" ] && echo YES || echo MISSING)"
          echo "SUPABASE_URL set:  $([ -n "$SUPABASE_URL" ]  && echo YES || echo MISSING)"
          echo "SUPABASE_KEY set:  $([ -n "$SUPABASE_KEY" ]  && echo YES || echo MISSING)"
          [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] || (echo "FATAL: SH secrets missing" && exit 1)

      - name: Run optical pilot pipeline
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python stage6_optical_pilot.py

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/optical/ OPTICAL_PILOT.md || true
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: stage6 optical pilot outputs [skip ci]"
          git push origin HEAD:main || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-optical-diagnostics
          path: |
            diagnostics/optical/shadow_metrics.csv
            diagnostics/optical/jw_optical_screen.csv
            diagnostics/optical/corr_grid.csv
            diagnostics/optical/rt_interleaved_cadence.csv
            diagnostics/optical/crops/
            OPTICAL_PILOT.md
