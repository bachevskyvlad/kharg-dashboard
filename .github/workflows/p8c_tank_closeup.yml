name: Research — P8c tank close-up + profiles

on:
  workflow_dispatch: {}

jobs:
  tank_closeup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy scipy tifffile matplotlib -q

      - name: Run tank close-up + profiles
        run: |
          mkdir -p diagnostics/mega
          python scripts/research/p8c_tank_closeup.py
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Commit results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add \
            diagnostics/mega/p8c_*.txt \
            diagnostics/mega/p8c_closeup_*.png \
            diagnostics/mega/p8c_profile_*.png \
            diagnostics/mega/p8c_profile_*.csv \
            diagnostics/mega/p8c_grd_*.png \
            2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "research: p8c_tank_closeup [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, sleeping ${attempt}s"
            sleep $attempt
          done || true
