name: Stage4 v2 panels

on:
  workflow_dispatch:

jobs:
  build-panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install sentinelhub numpy matplotlib scipy pandas pillow requests

      - name: Run stage4_v2_panels.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          cd scripts
          python stage4_v2_panels.py

      - name: Commit panels and CSV
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Code"
          git add diagnostics/stage4_v2/
          if git diff --cached --quiet; then
            echo "No new files to commit"
          else
            git commit -m "feat(qa): two-date three-panel PNGs + hints CSV (YB/JW)

Generated by stage4_v2_panels.py - machine hints only, no verdicts.
Panels: 8 YB (ASC 14) + 4 JW (DESC 35), each with SAR-A / SAR-B / S2.

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01VBJUxpJfFNw5i6YD1SXibt"
            git push origin claude/oilradar-dashboard-iran-zchdva
          fi
