name: Research — P9 peak gap metric

on:
  workflow_dispatch: {}

jobs:
  peak_gap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy scipy sentinelhub -q

      - name: Run peak gap pilot
        run: |
          mkdir -p diagnostics/mega
          python scripts/research/p9_peak_gap.py
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Commit and push results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add \
            diagnostics/mega/peak_gap_pilot.csv \
            diagnostics/mega/run_p9_*.txt \
            2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "research: p9_peak_gap [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, sleeping ${attempt}s"
            sleep $attempt
          done || true
