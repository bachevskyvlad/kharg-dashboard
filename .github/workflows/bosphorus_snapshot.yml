name: Bosphorus — SAR Snapshot

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'SAR date YYYY-MM-DD (blank = latest)'
        required: false
        default: ''
      backfill:
        description: 'Number of last SAR passes to process (blank = single latest)'
        required: false
        default: ''
      backfill_all:
        description: 'Process all available passes (~10 years). Set to "true" to enable.'
        required: false
        default: ''
      region:
        description: 'Anchorage region: black_sea (default) or marmara'
        required: false
        default: 'black_sea'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub numpy scipy pillow pandas cartopy

      - name: Run snapshot
        run: |
          REGION="${{ github.event.inputs.region }}"
          REGION="${REGION:-black_sea}"
          if [ "${{ github.event.inputs.backfill_all }}" = "true" ]; then
            python scripts/bosphorus_snapshot.py --backfill-all --region "$REGION"
          elif [ -n "${{ github.event.inputs.backfill }}" ]; then
            python scripts/bosphorus_snapshot.py --backfill "${{ github.event.inputs.backfill }}" --region "$REGION"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/bosphorus_snapshot.py --date "${{ github.event.inputs.date }}" --region "$REGION"
          else
            python scripts/bosphorus_snapshot.py --region "$REGION"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bosphorus-snapshot
          path: |
            data/bosphorus_*.png
            data/bosphorus_*_history.json
          if-no-files-found: warn

      - name: Commit to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/bosphorus_*_history.json /tmp/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bosphorus_*_history.json data/ 2>/dev/null || true
          git add data/bosphorus_*_history.json
          git diff --cached --quiet || git commit -m "chore: bosphorus snapshot $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
