name: Kharg — Ship Backfill

on:
  workflow_run:
    workflows: ["Monitor — Kharg SAR"]
    types: [completed]
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to process (blank = full backfill from 2017)'
        required: false
        default: ''
      resume:
        description: 'Resume (skip existing dates)'
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h — full backfill ~470 weeks × ~5s each ≈ 2.5h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub numpy scipy

      - name: Run backfill
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          ARGS="--resume"
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="--year ${{ github.event.inputs.year }}"
          fi
          if [ "${{ github.event.inputs.resume }}" = "false" ]; then
            ARGS="${ARGS/--resume/}"
          fi
          cd scripts
          python ship_backfill.py $ARGS

      - name: Commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add data/anchorage.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "anchorage backfill $(date -u +'%Y-%m-%d')"
          git push
