name: Saudi — Stage 4 Visual QA

on:
  workflow_dispatch:

jobs:
  stage4-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet sentinelhub numpy pandas scipy supabase requests Pillow

      - name: Run Stage 4 visual QA
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python scripts/stage4_visual_qa.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/stage4/
          git diff --cached --quiet || git commit -m "stage4: visual QA crops + report"
          git push origin claude/oilradar-dashboard-iran-zchdva
