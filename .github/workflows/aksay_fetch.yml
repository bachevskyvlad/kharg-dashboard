name: Ak-Sai glacier — fetch S2 frames

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-brahmagupta-0lzzag]
    paths: [aksay/fetch.py, .github/workflows/aksay_fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests Pillow numpy tifffile -q
      - name: Fetch frames
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python aksay/fetch.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add aksay/data/ || true
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: aksay S2 frames [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
