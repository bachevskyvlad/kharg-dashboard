name: Dardanelles — SAR Vessel Detection

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Zone to process'
        required: false
        default: 'aegean_entrance'
        type: choice
        options:
          - aegean_entrance
          - marmara_south
      mode:
        description: 'Run mode'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - backfill-all
          - backfill-10
  schedule:
    - cron: '0 4 * * 2,5'  # Tue & Fri — matches ~6-day Sentinel-1 revisit

jobs:
  snapshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["aegean_entrance","marmara_south"]') }}
      max-parallel: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub pillow numpy scipy cartopy pandas

      - name: Pull latest history before run
        run: git pull --rebase origin main || true

      - name: Run snapshot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          MODE="${{ inputs.mode || 'latest' }}"
          REGION="${{ matrix.region }}"
          if [ "$MODE" = "backfill-all" ]; then
            python scripts/dardanelles_snapshot.py --backfill-all --region "$REGION"
          elif [ "$MODE" = "backfill-10" ]; then
            python scripts/dardanelles_snapshot.py --backfill 10 --region "$REGION"
          else
            python scripts/dardanelles_snapshot.py --region "$REGION"
          fi

      - name: Commit history and latest PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dardanelles_*.json data/dardanelles_*.png 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: dardanelles ${{ matrix.region }} snapshot $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
