name: Saudi Stage 0 — Optical Radius Check
on:
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saudi-rebuild

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install sentinelhub matplotlib scipy Pillow -q

      - name: Run Stage 0 optical measurement
        run: python scripts/stage0_optical_measure.py
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/stage0/
          git commit -m "ci: stage0 optical radius check [skip ci]" || echo "nothing to commit"
          git push origin feature/saudi-rebuild

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-crops
          path: diagnostics/stage0/
