name: Research — P6 tank radius measurement (ESRI z18)

on:
  workflow_dispatch: {}

jobs:
  radius_measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy Pillow -q

      - name: Run radius measurement
        run: |
          mkdir -p diagnostics/mega
          python scripts/research/p6_radius_measure.py \
            2>&1 | tee diagnostics/mega/run_p6_radius_measure_$(date -u +%Y%m%dT%H%M).txt

      - name: Commit and push results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/mega/tank_radius_measured.csv \
                  diagnostics/mega/run_p6_radius_measure_*.txt 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "research: p6_radius_measure [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed"
            sleep $attempt
          done || true
