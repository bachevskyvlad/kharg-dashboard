name: Jask — per-tank SAR panels (20 tanks, human verdicts)

on:
  workflow_dispatch:
    inputs:
      tank:
        description: 'Single tank ID (leave empty for all 20)'
        type: string
        default: ''

jobs:
  jask_panels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas sentinelhub supabase shapely matplotlib tifffile Pillow requests -q

      - name: Render panels
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/jask/panels
          TANK_FLAG=""
          if [ -n "${{ inputs.tank }}" ]; then TANK_FLAG="--tank ${{ inputs.tank }}"; fi
          cd scripts
          python jask_panels.py $TANK_FLAG 2>&1 | tee ../diagnostics/jask/panels_run.txt

      - name: Save run log
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/jask/panels/ || true
          git add -f diagnostics/jask/panels_run.txt || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: jask panels — 20 tanks SAR+S2 [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true

      - name: Upload panels
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jask-panels
          path: diagnostics/jask/panels/
