name: Saudi Rebuild — Stage 3 (Backfill)
on:
  workflow_dispatch:
    inputs:
      terminal:
        description: 'Terminal to backfill (ras_tanura | juwaymah | yanbu)'
        required: true
        type: choice
        options:
          - ras_tanura
          - juwaymah
          - yanbu
      from_date:
        description: 'Start date ISO-8601 (default 2017-01-01)'
        type: string
        default: '2017-01-01'
      commit:
        description: 'Pass --commit to write to Supabase (dry-run if unchecked)'
        type: boolean
        default: false
      reset:
        description: 'Wipe checkpoint and restart from scratch'
        type: boolean
        default: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saudi-rebuild
      - run: pip install sentinelhub scipy supabase pandas numpy -q
      - name: Run backfill
        run: |
          FLAGS="--terminal ${{ inputs.terminal }} --from ${{ inputs.from_date }}"
          if [ "${{ inputs.commit }}" = "true" ]; then FLAGS="$FLAGS --commit"; fi
          if [ "${{ inputs.reset }}"  = "true" ]; then FLAGS="$FLAGS --reset";  fi
          python scripts/backfill_saudi.py $FLAGS
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
      - name: Save checkpoint
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .backfill_checkpoint_*.json diagnostics/ || true
          git commit -m "ci: backfill checkpoint ${{ inputs.terminal }} [skip ci]" || echo "nothing to commit"
          git push origin feature/saudi-rebuild || true
