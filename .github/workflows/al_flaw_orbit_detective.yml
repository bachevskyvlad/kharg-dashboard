name: al_flaw — data-derived orbit identification

on:
  workflow_dispatch:

jobs:
  al_flaw_orbit_detective:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas sentinelhub supabase shapely -q

      - name: Run al_flaw orbit detective
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics
          cd scripts
          python al_flaw_orbit_detective.py 2>&1 | tee ../diagnostics/al_flaw_detective_run.txt

      - name: Commit results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/AL_FLAW_ORBIT_DETECTIVE.md || true
          git add -f diagnostics/al_flaw_orbit_result.json || true
          git add -f diagnostics/al_flaw_detective_run.txt || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: al_flaw orbit detective — data-derived track [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
