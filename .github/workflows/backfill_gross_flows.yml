name: Backfill Gross Flows

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Debug gross flows function
        run: |
          python3 - <<'EOF'
          from supabase import create_client

          sb = create_client(
              "https://yoekhkczwdeyauwarsyy.supabase.co",
              "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
          )

          # Get the function definition
          r = sb.rpc("pg_get_functiondef_text", {"fname": "refresh_gross_flows"}).execute()
          print("FUNCTION DEF:", r.data)

          # Get earliest date in raw_observations
          r2 = sb.table("raw_observations").select("date").order("date", desc=False).limit(1).execute()
          print("EARLIEST raw_observations:", r2.data)

          # Get earliest date in kharg_gross_flows
          r3 = sb.table("kharg_gross_flows").select("date_from").order("date_from", desc=False).limit(1).execute()
          print("EARLIEST kharg_gross_flows:", r3.data)

          # Count rows in kharg_gross_flows before 2017
          r4 = sb.table("kharg_gross_flows").select("date_from", count="exact").lt("date_from", "2017-01-01").execute()
          print("Rows before 2017:", r4.count)
          EOF
