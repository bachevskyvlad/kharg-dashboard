name: Backfill Gross Flows

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Query missing passes and recompute
        run: |
          python3 - <<'EOF'
          from supabase import create_client

          sb = create_client(
              "https://yoekhkczwdeyauwarsyy.supabase.co",
              "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
          )

          # Get all unique dates in raw_observations between 2015-04-06 and 2017-02-18
          r = sb.table("raw_observations").select("date").gte("date", "2015-04-06").lte("date", "2017-02-18").order("date", desc=False).execute()
          dates = sorted(set(row["date"] for row in r.data))
          print(f"Unique dates between 2015-04-06 and 2017-02-18: {len(dates)}")
          for d in dates:
              print(" ", d)
          EOF
