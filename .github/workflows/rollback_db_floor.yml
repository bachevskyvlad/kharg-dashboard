name: Rollback DB_FLOOR for al_flaw

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests -q

      - name: Export pre-floor CSV from git
        run: |
          git show 367321d:diagnostics/al_faw/iraq_alfaw_pertank_v2.csv \
            > /tmp/pertank_prefloor.csv
          wc -l /tmp/pertank_prefloor.csv

      - name: Dry-run rollback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python rollback_db_floor_alfaw.py --csv /tmp/pertank_prefloor.csv 2>&1

      - name: Live rollback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python rollback_db_floor_alfaw.py --csv /tmp/pertank_prefloor.csv --force 2>&1 \
            | tee ../diagnostics/al_faw/db_floor_rollback.txt

      - name: Recompute db_norm after rollback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python h1_db_norm_refix.py --force 2>&1 | tee ../diagnostics/al_faw/h1_refix_postrollback.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/db_floor_rollback.txt || true
          git add -f diagnostics/al_faw/h1_refix_postrollback.txt || true
          git status --short
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: DB_FLOOR rollback + db_norm refix [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
