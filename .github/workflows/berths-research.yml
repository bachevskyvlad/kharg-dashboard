name: berths-research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pystac-client \
            planetary-computer \
            rasterio \
            scipy \
            numpy \
            Pillow \
            matplotlib \
            shapely \
            requests \
            sentinelhub

      - name: Step 1 — validate_optics_v4 (assert gate + contact sheet)
        id: validate
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/berth_validate_optics_v4.py

      - name: Step 1b — build east_t_head o101 2026 background
        if: steps.validate.outcome == 'success'
        run: python scripts/berth_build_bg_2026.py

      - name: Step 2 — v4_history full (CSV/JSON only, no DB write)
        if: steps.validate.outcome == 'success'
        id: history
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/berth_v4_history.py

      - name: Step 2b — assert + gates summary (tail of log)
        if: always()
        run: |
          echo "=== accuracy.txt (assert gate) ==="
          cat diagnostics/berth_v4/validation_optics_v4/accuracy.txt 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== validation_report.txt (gates b-f) ==="
          cat diagnostics/berth_v4/history_v4/validation_report.txt 2>/dev/null || echo "(not found)"

      - name: Step 3 — berth occupancy v2 page
        if: steps.history.outcome == 'success'
        id: page
        run: python scripts/berth_v2_page.py

      - name: Step 4 — acceptance gate g SAR crops (5×2025 + all autumn 2026)
        if: steps.history.outcome == 'success'
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/berth_v4_crops.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berths-research-${{ github.run_id }}
          path: diagnostics/berth_v4/
          retention-days: 30
