name: ESRI z18 crops (polarity diagnostic)

on:
  workflow_dispatch:

jobs:
  z18_crops:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy requests Pillow -q

      - name: Fetch z18 crops
        run: |
          mkdir -p diagnostics/al_faw/z18_crops
          python scripts/esri_z18_crops.py 2>&1 | tee diagnostics/al_faw/z18_crops/run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/z18_crops/
          git status --short
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: ESRI z18 crops for polarity diagnostic [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
