name: Diagnose — Ras Tanura SAR

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt matplotlib

      - name: Run diagnostic
        run: python scripts/diagnose_ras_tanura_imagery.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ras-tanura-diagnostics
          path: diagnostics/ras_tanura/
          retention-days: 30
