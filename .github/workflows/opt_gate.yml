name: Optical Kharg-30 Gate — step 4

on:
  workflow_dispatch: {}

jobs:
  opt_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas sentinelhub supabase requests Pillow -q

      - name: Run optical gate
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/optical
          cd scripts
          python optical_kharg_gate.py 2>&1 | tee ../diagnostics/optical/kharg_gate_run.txt

      - name: Save results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/optical/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: optical gate step-4 [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true
