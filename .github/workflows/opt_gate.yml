name: Optical Kharg-30 Gate

on:
  workflow_dispatch: {}

jobs:
  optical_kharg_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas matplotlib sentinelhub Pillow requests scipy -q

      - name: Run Kharg-30 gate
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/optical/tiles diagnostics/optical/crops
          cd scripts
          python optical_kharg_gate.py 2>&1 | tee ../diagnostics/optical/kharg_gate_run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/optical/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: optical Kharg-30 gate numbers [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true

      - name: Upload outputs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: optical-kharg-gate
          path: diagnostics/optical/
