name: ESRI z18 Measure — Zirku

on:
  workflow_dispatch:

jobs:
  esri_measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy requests Pillow -q

      - name: Measure radii
        run: |
          mkdir -p diagnostics/zirku
          cd scripts
          python esri_measure_terminal.py --terminal zirku 2>&1 | tee ../diagnostics/zirku/esri_measure_run.txt

      - name: Save outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/zirku/           || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: esri z18 measure — zirku [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
