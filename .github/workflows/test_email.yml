name: Test Email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        run: |
          curl -s -X POST "https://app.oilradar.io/auth/notify-sar" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_SECRET }}" \
            -d '{
              "pass_date": "2026-08-01",
              "vol_current": 24.5,
              "vol_prev": 23.1,
              "prev_date": "2026-07-26",
              "fill_rate_7d": 0.2
            }'
