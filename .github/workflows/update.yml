name: Update Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:

  # ── Step 1a: fetch Kharg SAR data → write raw to Supabase ──────────────────────
  kharg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Restore previous cache
        uses: dawidd6/action-download-artifact@v6
        with:
          name: kharg-raw-cache
          path: public/
          workflow: update.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true
      - name: Count dates BEFORE run
        id: before
        run: |
          if [ -f public/data_raw_cache.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('public/data_raw_cache.json')); print(len(set(r['date'] for r in d)))")
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      - name: Run Kharg SAR script
        run: python scripts/main_script.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Count dates AFTER run
        id: after
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('public/data_raw_cache.json')); print(len(set(r['date'] for r in d)))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      - name: Upload raw cache
        uses: actions/upload-artifact@v4
        with:
          name: kharg-raw-cache
          path: public/data_raw_cache.json
      - name: Upload volume graph
        uses: actions/upload-artifact@v4
        with:
          name: volume-graph
          path: public/volume_graph.png
      - name: Telegram - Kharg SUCCESS
        if: success()
        run: |
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          DIFF=$((AFTER - BEFORE))
          if [ "$DIFF" -gt 0 ]; then
            STATUS="&#128195; <b>New data added:</b> +${DIFF} date(s)"
          else
            STATUS="&#128564; No new data (still ${AFTER} dates)"
          fi
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>Kharg SAR &#8212; SUCCESS</b>
          ${STATUS}
          &#128225; Cached dates total: <code>${AFTER}</code>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram - Kharg FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Kharg SAR &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  # ── Step 1b: fetch GIE gas data → save lng_data.json as artifact ─────────
  lng:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch Europe gas storage (GIE)
        run: python scripts/fetch_lng_data.py
      - name: Upload LNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: lng-data
          path: data/lng_data.json
      - name: Telegram - LNG SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>GIE LNG &#8212; SUCCESS</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram - LNG FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>GIE LNG &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  # ── Step 1c: Gulf fragility pipeline → data/fragility.json ──────────────
  gulf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Restore Gulf raw cache
        uses: dawidd6/action-download-artifact@v6
        with:
          name: gulf-raw-cache
          path: data/
          workflow: update.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true
      - name: Run Gulf fragility pipeline
        run: python scripts/gulf_fragility_pipeline.py
      - name: Upload Gulf raw cache
        uses: actions/upload-artifact@v4
        with:
          name: gulf-raw-cache
          path: data/gulf_raw_cache.json
        continue-on-error: true
      - name: Upload fragility data
        uses: actions/upload-artifact@v4
        with:
          name: fragility-data
          path: data/fragility.json
      - name: Telegram - Gulf SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>Gulf Fragility &#8212; SUCCESS</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram - Gulf FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Gulf Fragility &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  # ── Step 1d: AIS vessel collector → Supabase ais_positions ─────────────
  ais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase websockets
      - name: Run AIS collector (5 min)
        run: python scripts/ais_collector.py
        env:
          AIS_RUN_DURATION: "300"
      - name: Telegram - AIS SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>AIS Collector &#8212; SUCCESS</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram - AIS FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>AIS Collector &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  # ── Step 2: dbt transforms raw kharg → analytics tables in Supabase ──────
  dbt:
    runs-on: ubuntu-latest
    needs: [kharg, lng]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install "dbt-postgres>=1.8,<2.0"
      - name: dbt run
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: aws-0-ap-south-1.pooler.supabase.com
        run: |
          cd dbt
          dbt run --profiles-dir .
      - name: dbt test
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: aws-0-ap-south-1.pooler.supabase.com
        run: |
          cd dbt
          dbt test --profiles-dir .
        continue-on-error: true
      - name: Telegram - dbt SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>dbt &#8212; SUCCESS</b>
          Models: kharg_daily &#8226; kharg_signals
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>"
      - name: Telegram - dbt FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>dbt &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  # ── Step 3: export from Supabase + artifacts → commit to GitHub ────────
  commit_data:
    runs-on: ubuntu-latest
    needs: [dbt, gulf]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supabase client
        run: pip install supabase
      - name: Download volume graph
        uses: actions/download-artifact@v4
        with:
          name: volume-graph
          path: public/
        continue-on-error: true
      - name: Download LNG data
        uses: actions/download-artifact@v4
        with:
          name: lng-data
          path: data/
        continue-on-error: true
      - name: Download fragility data
        uses: actions/download-artifact@v4
        with:
          name: fragility-data
          path: data/
        continue-on-error: true
      - name: Export Kharg data from Supabase
        run: python scripts/export_from_supabase.py
      - name: Commit and push
        run: |
          git config user.name  "bot"
          git config user.email "bot@github.com"
          [ -f public/volume_graph.png ] && cp public/volume_graph.png volume_graph.png || true
          git add data/ volume_graph.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto update $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
      - name: Telegram - Dashboard pushed
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#128640; <b>Dashboard updated</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://oilradar.io/monitor'>oilradar.io/monitor</a> &#8226; <a href='https://app.oilradar.io/dashboard'>app.oilradar.io/dashboard</a>"
      - name: Telegram - Commit FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Dashboard commit &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"
