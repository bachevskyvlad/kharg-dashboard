name: Update Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════
  # ДЖОБА 1 — Kharg SAR
  # ════════════════════════════════════════════
  kharg:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore previous Kharg cache
        uses: dawidd6/action-download-artifact@v6
        with:
          name: kharg-raw-cache
          path: public/
          workflow: update.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      - name: Count dates BEFORE run
        id: before
        run: |
          if [ -f public/data_raw_cache.json ]; then
            COUNT=$(python3 -c "
import json
d=json.load(open('public/data_raw_cache.json'))
print(len(set(r['date'] for r in d)))
")
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Run Kharg SAR script
        run: python scripts/main_script.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Count dates AFTER run
        id: after
        run: |
          COUNT=$(python3 -c "
import json
d=json.load(open('public/data_raw_cache.json'))
print(len(set(r['date'] for r in d)))
")
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload raw cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharg-raw-cache
          path: public/data_raw_cache.json

      - name: Upload Kharg output artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharg-output
          path: |
            public/data.json
            public/data_daily.json
            public/volume_graph.png

      - name: Telegram — Kharg SUCCESS
        if: success()
        run: |
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          DIFF=$((AFTER - BEFORE))
          if [ "$DIFF" -gt 0 ]; then
            STATUS="🆕 <b>New data added:</b> +${DIFF} date(s)"
          else
            STATUS="💤 No new data (still ${AFTER} dates)"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Kharg SAR — SUCCESS</b>
          ${STATUS}
          📡 Cached dates total: <code>${AFTER}</code>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_id }}</a>"

      - name: Telegram — Kharg FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Kharg SAR — FAILED</b>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Открыть логи</a>"

  # ════════════════════════════════════════════
  # ДЖОБА 2 — GIE LNG
  # ════════════════════════════════════════════
  lng:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Europe gas storage (GIE)
        run: python scripts/fetch_lng_data.py

      - name: Upload LNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: lng-output
          path: public/lng_data.json

      - name: Telegram — LNG SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>GIE LNG — SUCCESS</b>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_id }}</a>"

      - name: Telegram — LNG FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>GIE LNG — FAILED</b>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Открыть логи</a>"

  # ════════════════════════════════════════════
  # ДЖОБА 3 — Commit data back to this repo
  # ════════════════════════════════════════════
  commit_data:
    runs-on: ubuntu-latest
    needs: [kharg, lng]
    if: always()
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Kharg output
        uses: actions/download-artifact@v4
        with:
          name: kharg-output
          path: public/
        continue-on-error: true

      - name: Download LNG output
        uses: actions/download-artifact@v4
        with:
          name: lng-output
          path: public/
        continue-on-error: true

      - name: Copy outputs to repo folders
        run: |
          mkdir -p data
          [ -f public/data.json ]        && cp public/data.json        data/data.json || true
          [ -f public/data_daily.json ]  && cp public/data_daily.json  data/data_daily.json || true
          [ -f public/volume_graph.png ] && cp public/volume_graph.png volume_graph.png || true
          [ -f public/lng_data.json ]    && cp public/lng_data.json    lng_data.json || true

      - name: Commit and push
        run: |
          git config user.name  "bot"
          git config user.email "bot@github.com"
          git add data/ volume_graph.png lng_data.json
          git commit -m "auto update $(date -u +'%Y-%m-%d')" || echo "no changes"
          git push

      - name: Telegram — Commit SUCCESS
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>Dashboard updated</b>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}'>kharg-dashboard</a>"

      - name: Telegram — Commit FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Dashboard commit — FAILED</b>
          📅 <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Открыть логи</a>"
