name: Bab-el-Mandeb — SAR Snapshot

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Week start YYYY-MM-DD (blank = latest available)'
        required: false
        default: ''

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub numpy scipy pillow

      - name: Fetch SAR snapshot
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          cd scripts
          python bab_snapshot.py $ARGS

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bab-sar-snapshot
          path: data/bab_snapshot_*.png
          retention-days: 30
