name: Series v2 — Al-Faw daily volumes

on:
  workflow_dispatch:

jobs:
  series_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests -q

      - name: Run series_v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          python series_v2.py 2>&1 | tee ../diagnostics/al_faw/series_v2_run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/iraq_alfaw_daily_v2.csv || true
          git add -f diagnostics/al_faw/iraq_alfaw_pertank_v2.csv || true
          git add -f diagnostics/al_faw/series_v2_run.txt || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: series_v2 outputs — Al-Faw daily volumes [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
