name: Stage 5b — ASC screen fix, M1 validation, verdict

on:
  workflow_dispatch:
    inputs: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas numpy -q

      - name: Run unit tests (metrics.py)
        run: python scripts/metrics.py

      - name: Run full pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python stage5b_asc_pipeline.py

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/rt_decomp/ ASC_VALIDATION.md || true
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: stage5b v2 outputs — ASC screen + M1 verdict [skip ci]"
          git push origin claude/oilradar-dashboard-iran-zchdva || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-diagnostics
          path: |
            diagnostics/rt_decomp/asc_screen_v2.csv
            diagnostics/rt_decomp/asc_desc_series_2024.csv
            ASC_VALIDATION.md
