name: Ak-Sai — Hugonnet 2021 lookup

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-brahmagupta-0lzzag]
    paths: [aksay/hugonnet.py, .github/workflows/aksay_hugonnet.yml]

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas tables -q
      - run: python aksay/hugonnet.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add aksay/data/hugonnet_aksay.json || true
          git diff --cached --quiet && echo "No new files" || git commit -m "ci: aksay hugonnet lookup [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
