name: Hormuz Timeseries
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2025-12-01'
jobs:
  timeseries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
      - run: pip install sentinelhub scipy matplotlib -q
      - name: Run timeseries
        run: python scripts/hormuz_timeseries.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          START_DATE: ${{ inputs.start_date }}
      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp /tmp/hormuz_timeseries.csv data/hormuz_timeseries.csv || true
          cp /tmp/hormuz_timeseries.jpg data/hormuz_timeseries.jpg || true
          git add data/hormuz_timeseries.csv data/hormuz_timeseries.jpg
          git commit -m "ci: hormuz weekly timeseries [skip ci]" || echo "nothing to commit"
          git push origin claude/oilradar-dashboard-iran-zchdva
