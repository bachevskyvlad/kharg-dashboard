name: Stage 2 gate questionnaire — calibration

on:
  workflow_dispatch:

jobs:
  stage2_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas sentinelhub supabase shapely -q

      - name: Stage 2 gate questionnaire
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics
          cd scripts
          python stage2_gate_questionnaire.py 2>&1 | tee ../diagnostics/stage2_gate_run.txt

      - name: Save outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/stage2_gate_run.txt    || true
          git add -f diagnostics/STAGE2_GATE.md         || true
          git add -f diagnostics/stage2_gate_result.json || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: stage2 gate questionnaire [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
