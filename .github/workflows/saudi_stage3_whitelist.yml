name: Saudi — Stage 3 Whitelist

on:
  workflow_dispatch:

jobs:
  stage3-whitelist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet sentinelhub numpy pandas scipy supabase requests

      - name: Run Stage 3 whitelist
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python scripts/stage3_whitelist.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/stage3/
          git diff --cached --quiet || git commit -m "stage3: whitelist results"
          git push origin claude/oilradar-dashboard-iran-zchdva
