name: Diagnose Round 7.5 — Sweep fix + full recalculation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recalc75:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt matplotlib pillow scipy opencv-python-headless

      - name: Run Round 7.5 recalculation
        run: python scripts/diag_recalc_7_5.py --tasks 1,2,3,4,5
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit diagnostics to feature branch
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add diagnostics/round7_5/
          git diff --cached --stat
          git commit -m "diag round7.5: sweep fix + full recalculation" || echo "Nothing to commit"
          git push origin claude/oilradar-dashboard-iran-zchdva
