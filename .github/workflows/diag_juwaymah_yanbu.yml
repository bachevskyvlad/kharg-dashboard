name: Diagnose Round 3 — Juwaymah + Yanbu

on:
  workflow_dispatch:

jobs:
  diagnose3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt matplotlib pillow

      - name: Run Round 3 diagnostic
        run: python scripts/diag_juwaymah_yanbu_3.py --tasks 1,2,3,4
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload overlays
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-overlays
          path: diagnostics/juwaymah/overlay_*.png
          retention-days: 3

      - name: Upload Yanbu overlays
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-yanbu-overlays
          path: diagnostics/yanbu/overlay_*.png
          retention-days: 3

      - name: Upload report and SQL
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-report
          path: |
            diagnostics/DIAGNOSTIC_JUAYMAH_YANBU_3.md
            diagnostics/sql/juwaymah_yanbu_provenance.sql
          retention-days: 3
