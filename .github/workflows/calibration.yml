name: Calibration — Kharg vs UANI exports

on:
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase pandas numpy scipy
      - name: Run calibration
        run: python calibration/calibrate_kharg.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: calibration-results
          path: calibration/calibration_results.json
