name: Fetch Single S2 Image

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD)'
        required: true
        default: '2026-07-20'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests Pillow
      - name: Fetch image and update viewer
        run: python scripts/fetch_single_s2.py ${{ github.event.inputs.date }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/kharg_viewer.html
          git diff --cached --quiet || git commit -m "data: add S2 image ${{ github.event.inputs.date }} to viewer"
          git push
