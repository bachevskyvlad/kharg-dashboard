name: Update Tanker Queue (Anchorage)

# ТЗ-12.3: new pipeline (ТЗ-12.2 frame 50.25–50.52 / 29.08–29.33, masks
# data/exclusion_zones.geojson v2, prod threshold). Weekly: new orbit-35 dates
# -> upsert Supabase anchorage_daily / anchorage_ships -> two latest full PNGs
# to Storage bucket anchorage_snapshots (latest.png / previous.png / snapshots.json).
# Also resumes the old ship_backfill.py -> data/anchorage.json pipeline so the
# file stays in sync for export/reference.

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet sentinelhub scipy numpy Pillow matplotlib rasterio shapely requests

      - name: New dates -> Supabase + snapshots
        env:
          CLIENT_ID:          ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:      ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          RUN_ID:             gha-${{ github.run_id }}
        run: python diagnostics/anchorage_hist/hist_backfill.py --update

      - name: Update anchorage.json (resume backfill)
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/ship_backfill.py --resume

      - name: Commit updated anchorage.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/anchorage.json
          git diff --cached --quiet && echo "No changes" || git commit -m "data: update anchorage.json [skip ci]"
          git pull --rebase origin main
          git push origin main || true
