name: Update Tanker Queue (Anchorage)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install sentinelhub scipy numpy -q

      - name: Run ship backfill (resume mode)
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/ship_backfill.py --resume

      - name: Commit updated anchorage.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/anchorage.json
          git diff --cached --quiet && echo "No changes" || git commit -m "data: update anchorage tanker queue"
          git push origin main || true
