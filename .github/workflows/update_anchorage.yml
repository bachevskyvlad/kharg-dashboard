name: Update Tanker Queue (Anchorage)

# ТЗ-12.3: new pipeline (ТЗ-12.2 frame 50.25–50.52 / 29.08–29.33, masks
# data/exclusion_zones.geojson v2, prod threshold). Weekly: new orbit-35 dates
# -> upsert Supabase anchorage_daily / anchorage_ships -> two latest full PNGs
# to Storage bucket anchorage_snapshots (latest.png / previous.png / snapshots.json).
# The old pipeline (scripts/ship_backfill.py -> data/anchorage.json) is no longer
# run here; the script and data/anchorage.json are kept untouched as a reference.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet sentinelhub scipy numpy Pillow matplotlib rasterio shapely requests

      - name: New dates -> Supabase + snapshots
        env:
          CLIENT_ID:          ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:      ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:       https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_WRITE_KEY: sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM   # same key as ingest/compute in monitor.yml
          RUN_ID:             gha-${{ github.run_id }}
        run: python diagnostics/anchorage_hist/hist_backfill.py --update
