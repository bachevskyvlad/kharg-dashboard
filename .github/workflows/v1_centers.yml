name: Research — V1 Tank Centers

on:
  workflow_dispatch:
    inputs:
      terminals:
        description: "Comma-separated terminal IDs"
        required: false
        default: "kharg,ras_tanura,yanbu,al_flaw,jask"

jobs:
  v1_centers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas scipy matplotlib sentinelhub supabase -q

      - name: Run V1 tank centers
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/research/2026-10/v1
          cd scripts
          python research/v1_tank_centers.py \
            --terminals "${{ github.event.inputs.terminals }}" \
            2>&1 | tee ../diagnostics/research/2026-10/v1/run_v1.txt

      - name: Save results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A diagnostics/research/2026-10/v1/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "research: V1 tank centers ${{ github.event.inputs.terminals }} [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, retrying in ${attempt}s"
            sleep $attempt
          done || true
