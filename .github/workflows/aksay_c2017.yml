name: Ak-Sai — rev4 C (September 2017 check)

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-brahmagupta-0lzzag]
    paths: [aksay/c_fetch.py, .github/workflows/aksay_c2017.yml]

permissions:
  contents: write

jobs:
  c2017:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests Pillow numpy tifffile -q
      - env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: cd aksay && python c_fetch.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add aksay/data/c2017/ || true
          git diff --cached --quiet && echo "No new files" || git commit -m "ci: aksay c2017 [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
