name: Gas Storage — GIE Europe

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:

  gas_storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch Europe gas storage (GIE)
        run: python scripts/fetch_gas_storage.py
      - name: Commit and push
        run: |
          git config user.name  "bot"
          git config user.email "bot@github.com"
          git add data/gas_storage.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto update gas-storage $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
      - name: Telegram - Gas Storage SUCCESS
        if: success()
        run: |
          EU_FULL=$(jq -r '.countries.EU.data[-1].full // "?"' data/gas_storage.json 2>/dev/null || echo "?")
          EU_DATE=$(jq -r '.countries.EU.data[-1].date // "?"' data/gas_storage.json 2>/dev/null || echo "?")
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>Gas Storage &#8212; SUCCESS</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#127466;&#127482; EU fill: <b>${EU_FULL}%</b> (${EU_DATE})
          &#128279; <a href='https://oilradar.io/gas-storage'>oilradar.io/gas-storage</a>"
      - name: Telegram - Gas Storage FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Gas Storage &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"
