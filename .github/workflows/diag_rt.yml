name: Diag — Ras Tanura terminal_observations

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install supabase -q
      - name: Run diagnostics
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/diag_rt.py
