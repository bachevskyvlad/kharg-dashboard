name: Jask ESRI z18 measurement — 20 tanks

on:
  workflow_dispatch:

jobs:
  jask_esri_measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests Pillow -q

      - name: Run ESRI z18 measurement
        run: |
          mkdir -p diagnostics/jask/esri
          cd scripts
          python jask_esri_measure.py 2>&1 | tee ../diagnostics/jask/jask_esri_run.txt

      - name: Save outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/jask/esri/             || true
          git add -f diagnostics/jask/JASK_ESRI_MEASURE.md || true
          git add -f diagnostics/jask/jask_esri_run.txt  || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: jask esri z18 measurement — 20 tanks [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
