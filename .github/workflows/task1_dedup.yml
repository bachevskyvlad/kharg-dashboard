name: Task 1 — Al-Faw Dedup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run only (no deletes)"
        type: boolean
        default: true

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests -q

      - name: Run dedup
        env:
          SUPABASE_URL: "https://yoekhkczwdeyauwarsyy.supabase.co"
          SUPABASE_KEY: "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python dedup_terminal_observations.py --dry-run 2>&1 | tee ../diagnostics/al_faw/dedup_run.txt
          else
            python dedup_terminal_observations.py 2>&1 | tee ../diagnostics/al_faw/dedup_run.txt
          fi

      - name: Export iraq_alfaw_daily.csv
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: "https://yoekhkczwdeyauwarsyy.supabase.co"
          SUPABASE_KEY: "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
        run: |
          python3 - <<'PYEOF'
          import os, requests, pandas as pd
          from pathlib import Path

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SB_KEY = os.environ["SUPABASE_KEY"]
          HEADERS = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}"}

          rows, offset = [], 0
          while True:
              url = (f"{SB_URL}/rest/v1/terminal_observations"
                     f"?terminal_id=eq.al_flaw"
                     f"&select=date,tank_id,db_mean,radius_m,h_max"
                     f"&order=date.asc,tank_id.asc"
                     f"&offset={offset}&limit=1000")
              r = requests.get(url, headers=HEADERS, timeout=60)
              r.raise_for_status()
              batch = r.json()
              rows.extend(batch)
              if len(batch) < 1000:
                  break
              offset += 1000

          df = pd.DataFrame(rows)
          df["date"] = pd.to_datetime(df["date"]).dt.date

          import numpy as np
          BARREL_PER_M3 = 6.2898
          TANK_HEIGHT_MIN = 2.0
          df["db_mean"] = pd.to_numeric(df["db_mean"], errors="coerce")
          p5, p95 = df["db_mean"].quantile(0.05), df["db_mean"].quantile(0.95)
          df["db_clip"] = df["db_mean"].clip(p5, p95)
          df["fill_ratio"] = (p95 - df["db_clip"]) / (p95 - p5)
          df["h_max"] = pd.to_numeric(df["h_max"], errors="coerce").fillna(14)
          df["radius_m"] = pd.to_numeric(df["radius_m"], errors="coerce").fillna(40)
          df["h_current"] = TANK_HEIGHT_MIN + df["fill_ratio"] * (df["h_max"] - TANK_HEIGHT_MIN)
          df["vol_bbl"] = np.pi * df["radius_m"]**2 * df["h_current"] * BARREL_PER_M3

          daily = df.groupby("date")["vol_bbl"].sum().reset_index()
          daily["vol_mn_bbl"] = (daily["vol_bbl"] / 1e6).round(4)
          daily = daily[["date", "vol_mn_bbl"]]

          Path("diagnostics/al_faw").mkdir(parents=True, exist_ok=True)
          daily.to_csv("diagnostics/al_faw/iraq_alfaw_daily.csv", index=False)
          print(f"iraq_alfaw_daily.csv: {len(daily)} rows, range {daily['date'].min()}–{daily['date'].max()}")
          print(f"vol range: {daily['vol_mn_bbl'].min():.3f}–{daily['vol_mn_bbl'].max():.3f} Mn bbl")
          PYEOF

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/ || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: task1 al-faw dedup outputs [skip ci]"
          git push origin HEAD:main || true
