name: Orbit survey — relative_orbit for all terminals

on:
  workflow_dispatch:

jobs:
  orbit_survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy sentinelhub supabase shapely -q

      - name: orbit_survey — catalogue scan all terminals
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics
          cd scripts
          python orbit_survey.py --force 2>&1 | tee ../diagnostics/orbit_survey_run.txt

      - name: Commit survey outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/orbit_survey_registry_patch.json || true
          git add -f diagnostics/ORBIT_SURVEY.md || true
          git add -f diagnostics/orbit_survey_run.txt || true
          git status --short
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: orbit_survey — relative_orbit catalogue all terminals [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
