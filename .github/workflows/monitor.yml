name: Monitor — Kharg SAR

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force_reset:
        description: 'Skip cache restore and reprocess all history'
        required: false
        default: 'false'

env:
  REVISIT_GATE_DAYS: "5"
  TG_BOT: "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage"
  TG_CHAT: "204715787"

jobs:

  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(python3 -c "import json;print(json.load(open('data/data_daily.json'))['dates'][-1])")
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "Last data point: $LAST ($DAYS days ago); gate = ${REVISIT_GATE_DAYS}d"
          if [ "$DAYS" -ge "${REVISIT_GATE_DAYS}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Too soon - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run ingest
        run: python scripts/ingest.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Save ingest summary
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/ingest_summary.json
          key: ingest-summary-${{ github.run_id }}
      - name: Telegram — Ingest FAILED
        if: failure()
        run: |
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Ingest FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"

  compute:
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run compute
        run: python scripts/compute.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Save compute artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            data/_kharg_daily.parquet
            data/_kharg_weekly.parquet
            data/_terminal_daily.pkl
          key: kharg-compute-${{ github.run_id }}
      - name: Telegram — Compute FAILED
        if: failure()
        run: |
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Compute FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"

  export:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Restore compute artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            data/_kharg_daily.parquet
            data/_kharg_weekly.parquet
            data/_terminal_daily.pkl
          key: kharg-compute-${{ github.run_id }}
      - name: Restore ingest summary
        uses: actions/cache/restore@v4
        with:
          path: data/ingest_summary.json
          key: ingest-summary-${{ github.run_id }}
        continue-on-error: true
      - name: Count dates BEFORE
        id: before
        run: |
          COUNT=$(python3 scripts/count_sb_dates.py)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Run export
        run: python scripts/export.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Count dates AFTER
        id: after
        run: |
          COUNT=$(python3 scripts/count_sb_dates.py)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Save volume graph
        uses: actions/cache/save@v4
        with:
          path: public/volume_graph.png
          key: kharg-volume-graph-${{ github.run_id }}
      - name: Telegram — Export FAILED
        if: failure()
        run: |
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Export FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram — Pipeline SUCCESS
        if: success()
        run: |
          LINES=$(python3 scripts/tg_summary.py)
          TEXT="$(printf '&#9989; <b>OilRadar SAR &#8212; SUCCESS</b>\n\n%s\n\n&#128197; <code>%s</code>\n&#128279; <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run #${{ github.run_number }}</a>' "$LINES" "$(date -u +'%Y-%m-%d %H:%M UTC')")"
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" --data-urlencode text="$TEXT"

  commit_data:
    runs-on: ubuntu-latest
    needs: [gate, export]
    if: always() && needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase pandas
      - name: Restore volume graph
        uses: actions/cache/restore@v4
        with:
          path: public/volume_graph.png
          key: kharg-volume-graph-${{ github.run_id }}
        continue-on-error: true
      - name: Fetch crude prices
        run: pip install yfinance --quiet && python scripts/fetch_prices.py
        continue-on-error: true
      - name: Export Kharg data from Supabase
        run: python scripts/export_from_supabase.py
      - name: Export Iran terminal JSON files
        run: python scripts/export_terminal_json.py
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.name  "bot"
          git config user.email "bot@github.com"
          [ -f public/volume_graph.png ] && cp public/volume_graph.png volume_graph.png || true
          git add data/ volume_graph.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto update kharg $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
      - name: Telegram — Commit FAILED
        if: failure()
        run: |
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Commit FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  validate:
    needs: [gate, commit_data]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase
      - name: Run validation pass and send to Telegram
        run: python scripts/validate_pass.py --send
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Telegram — Validate FAILED
        if: failure()
        run: |
          curl -s -X POST "$TG_BOT" -d chat_id="$TG_CHAT" -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Validate FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"
