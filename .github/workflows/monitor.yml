name: Monitor — Kharg SAR

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:

  kharg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Restore previous cache
        uses: dawiwd6/action-download-artifact@v6
        with:
          name: kharg-raw-cache
          path: public/
          workflow: monitor.yml
          workflow_conclusion: ""
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true
      - name: Count dates BEFORE run
        id: before
        run: |
          if [ -f public/data_raw_cache.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('public/data_raw_cache.json')); print(len(set(r['date'] for r in d)))")
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      - name: Run Kharg SAR script
        run: python scripts/main_script.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Count dates AFTER run
        id: after
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('public/data_raw_cache.json')); print(len(set(r['date'] for r in d)))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      - name: Upload raw cache
        uses: actions/upload-artifact@v4
        with:
          name: kharg-raw-cache
          path: public/data_raw_cache.json
      - name: Upload volume graph
        uses: actions/upload-artifact@v4
        with:
          name: volume-graph
          path: public/volume_graph.png
      - name: Telegram - Kharg SUCCESS
        if: success()
        run: |
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          DIFF=$((AFTER - BEFORE))
          if [ "$DIFF" -gt 0 ]; then
            STATUS="&#128195; <b>New data added:</b> +${DIFF} date(s)"
          else
            STATUS="&#128564; No new data (still ${AFTER} dates)"
          fi
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#9989; <b>Kharg SAR &#8212; SUCCESS</b>
          ${STATUS}
          &#128225; Cached dates total: <code>${AFTER}</code>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Run #${{ github.run_number }}</a>"
      - name: Telegram - Kharg FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Kharg SAR &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"

  dbt:
    runs-on: ubuntu-latest
    needs: [kharg]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install "dbt-postgres>=1.8,<2.0"
      - name: dbt run
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: aws-0-ap-south-1.pooler.supabase.com
        run: |
          cd dbt
          dbt run --profiles-dir .
      - name: dbt test
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: aws-0-ap-south-1.pooler.supabase.com
        run: |
          cd dbt
          dbt test --profiles-dir .
        continue-on-error: true

  commit_data:
    runs-on: ubuntu-latest
    needs: [dbt]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supabase client
        run: pip install supabase
      - name: Download volume graph
        uses: actions/download-artifact@v4
        with:
          name: volume-graph
          path: public/
        continue-on-error: true
      - name: Export Kharg data from Supabase
        run: python scripts/export_from_supabase.py
      - name: Commit and push
        run: |
          git config user.name  "bot"
          git config user.email "bot@github.com"
          [ -f public/volume_graph.png ] && cp public/volume_graph.png volume_graph.png || true
          git add data/ volume_graph.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto update kharg $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
      - name: Telegram - Dashboard pushed
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#128640; <b>Kharg data updated</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://oilradar.io/monitor'>oilradar.io/monitor</a>"
      - name: Telegram - Commit FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="&#10060; <b>Kharg commit &#8212; FAILED</b>
          &#128197; <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>
          &#128279; <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open logs</a>"
