name: Stage H5 — Al-Faw SAR+S2 Panels (Этап 0)

on:
  workflow_dispatch:
    inputs: {}

jobs:
  panels:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas numpy requests Pillow scipy sentinelhub matplotlib -q

      - name: Run H5 Al-Faw panels
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw/panels
          cd scripts
          python stage_h5_alfaw_panels.py 2>&1 | tee ../diagnostics/al_faw/panels/run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/panels/ || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: stage_h5 alfaw panels [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload panels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5-alfaw-panels
          path: |
            diagnostics/al_faw/panels/
