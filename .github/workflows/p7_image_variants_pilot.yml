name: Research — P7 image_variants_pilot

on:
  workflow_dispatch: {}

jobs:
  image_variants_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: |
          pip install requests numpy scipy tifffile scikit-image matplotlib -q
          pip install bm3d -q || echo "bm3d not available (optional)"

      - name: Run pilot filter comparison
        run: |
          mkdir -p diagnostics/mega
          python scripts/research/p7_image_variants_pilot.py \
            2>&1 | tee diagnostics/mega/run_p7_pilot_$(date -u +%Y%m%dT%H%M).txt
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Commit and push results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add \
            diagnostics/mega/crops_pilot.npz \
            diagnostics/mega/image_variants_pilot.csv \
            diagnostics/mega/variant_*.npz \
            diagnostics/mega/png_check_*.png \
            diagnostics/mega/run_p7_pilot_*.txt \
            2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "research: p7_image_variants_pilot [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, sleeping ${attempt}s"
            sleep $attempt
          done || true
