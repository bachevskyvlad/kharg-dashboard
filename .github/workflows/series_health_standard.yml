name: Series Health Standard — corridors + gate validation

on:
  workflow_dispatch: {}

jobs:
  series_health_standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase sentinelhub -q

      - name: Stage 1 — compute SERIES_HEALTH_STANDARD corridors
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics
          python scripts/series_health_standard.py \
            --out diagnostics/SERIES_HEALTH_STANDARD.md
          echo "=== CORRIDORS ===" && cat diagnostics/SERIES_HEALTH_STANDARD.md

      - name: Unit test — synthetic DEAD series (constant + noise)
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, "scripts")
          # Patch out DB import so series_health functions load without creds
          import types
          fake_sb = types.SimpleNamespace(table=lambda *a, **kw: None)
          import importlib.util, importlib
          # Load series_health without executing main or DB calls
          import numpy as np, pandas as pd
          from pathlib import Path

          # Reproduce compute_metrics and apply_gate inline with synthetic data
          # Synthetic: constant signal + small noise → DEAD (dynamic_range_db ≈ 0)
          rng = np.random.default_rng(42)
          dates = pd.date_range("2020-01-01", periods=100, freq="6D")
          tanks = [f"t{i}" for i in range(5)]
          rows = []
          for d in dates:
              for t in tanks:
                  rows.append({"date": d, "tank_id": t, "db_mean": -8.0 + rng.normal(0, 0.05)})
          df = pd.DataFrame(rows)

          # Inline compute_metrics (mirrors series_health.py exactly)
          daily = df.groupby("date")["db_mean"].mean().sort_index()
          dynamic_range_db = float(daily.quantile(0.95) - daily.quantile(0.05))
          print(f"Synthetic dr={dynamic_range_db:.4f}dB")
          assert dynamic_range_db < 0.5, f"Expected dr<0.5 for flat signal, got {dynamic_range_db}"
          print("UNIT TEST: synthetic DEAD dr check — PASS")

          # Check unconditional DEAD gate fires
          DEAD_DR_ABS = 0.5
          flags = {}
          dead_flags = []
          if dynamic_range_db < DEAD_DR_ABS:
              flags["dynamic_range_db"] = {"value": dynamic_range_db, "flag": "BELOW_ABS_MIN"}
              dead_flags.append(("dynamic_range_db", dynamic_range_db, DEAD_DR_ABS, float("nan")))
          is_dead = len(dead_flags) >= 2 or ("dynamic_range_db" in flags)
          verdict = "FLAG" if flags else "PASS"
          diagnosis = "DEAD" if (flags and is_dead) else None
          assert verdict == "FLAG" and diagnosis == "DEAD", \
              f"Expected FLAG/DEAD for constant series, got {verdict}/{diagnosis}"
          print("UNIT TEST: synthetic DEAD gate verdict — PASS")
          EOF

      - name: Unit test — aggregate DR trap (7 constants at different levels → DEAD)
        run: |
          python - <<'EOF'
          import sys, re
          import numpy as np
          import pandas as pd
          from pathlib import Path

          # Construct the aggregate DR inflation trap:
          # 7 tanks each stuck at a different constant level.
          # STAGGERED presence — each tank absent ~25% of dates (deterministic pattern).
          # This makes the daily aggregate mean vary (different subset each day)
          # → aggregate DR inflated to several dB WITHOUT any tank moving.
          # The frozen DEAD criterion must catch this via cycling metrics, not DR.
          rng = np.random.default_rng(99)
          dates = pd.date_range("2020-01-01", periods=160, freq="6D")
          levels = [-20.0, -15.0, -10.0, -5.0, 0.0, 5.0, 10.0]  # 30 dB spread
          tanks  = [f"t{i}" for i in range(7)]
          rows = []
          for i, d in enumerate(dates):
              for j, (t, lv) in enumerate(zip(tanks, levels)):
                  # Tank j skipped when date_index % 4 == j % 4 (each tank absent ~25%)
                  if i % 4 != j % 4:
                      rows.append({"date": d, "tank_id": t,
                                   "db_mean": lv + rng.normal(0, 0.05)})
          df = pd.DataFrame(rows)
          df["date"] = pd.to_datetime(df["date"])

          daily = df.groupby("date")["db_mean"].mean().sort_index()
          dr = float(daily.quantile(0.95) - daily.quantile(0.05))
          print(f"Aggregate DR={dr:.3f}dB  (staggered-presence inflation — no tank moved)")
          assert dr > 1.0, f"Staggered-presence DR={dr:.3f} unexpectedly flat; check test design"

          live_threshold = 0.05 * dr

          deltas_raw = daily.diff().dropna().abs()
          delta_p50_norm = float(deltas_raw.quantile(0.50) / dr)
          delta_p90_norm = float(deltas_raw.quantile(0.90) / dr)

          ma = daily.rolling("30D").mean().dropna()
          demeaned = ma - ma.mean()
          signs = np.sign(demeaned.values)
          crossings = int(np.sum(np.diff(signs) != 0))
          span_years = (daily.index[-1] - daily.index[0]).days / 365.25
          cycles_per_year = float(crossings / 2 / span_years) if span_years > 0 else 0.0

          per_tank_steps = []
          for _, tdf in df.groupby("tank_id"):
              s = tdf.sort_values("date")["db_mean"]
              steps = s.diff().dropna().abs()
              if len(steps) >= 3:
                  per_tank_steps.append(float(steps.median()))
          live_fraction = float(np.mean([s >= live_threshold for s in per_tank_steps])) \
                          if per_tank_steps else 0.0

          print(f"  delta_p50_norm={delta_p50_norm:.4f}  delta_p90_norm={delta_p90_norm:.4f}")
          print(f"  cycles_per_year={cycles_per_year:.4f}  live_fraction={live_fraction:.4f}")

          METRIC_LABELS = {
              "cycles_per_year": "Build-draw cycles/year",
              "delta_p50_norm":  "Δ p50 (norm by dr)",
              "delta_p90_norm":  "Δ p90 (norm by dr)",
              "live_fraction":   "Live fraction (step≥5% dr)",
          }
          text = Path("diagnostics/SERIES_HEALTH_STANDARD.md").read_text()
          table_section = re.search(r"\| Metric \|.*?Corridor hi \|\n((?:\|.*?\n)+)", text)
          corridors = {}
          if table_section:
              for line in table_section.group(1).strip().split("\n"):
                  parts = [p.strip() for p in line.split("|")[1:-1]]
                  if len(parts) < 5:
                      continue
                  label = parts[0]
                  lo_s, hi_s = parts[3], parts[4]
                  for k, l in METRIC_LABELS.items():
                      if l == label and lo_s not in ("n/a", "") and hi_s not in ("n/a", ""):
                          try:
                              corridors[k] = (float(lo_s), float(hi_s))
                          except ValueError:
                              pass
          print(f"  Corridors loaded: {list(corridors.keys())}")

          DEAD_DR_ABS = 0.5
          dead_flags = []
          metrics = {
              "cycles_per_year": cycles_per_year,
              "delta_p50_norm":  delta_p50_norm,
              "delta_p90_norm":  delta_p90_norm,
              "live_fraction":   live_fraction,
          }
          UPPER_SKIP = {"live_fraction"}
          for key, (lo, hi) in corridors.items():
              val = metrics.get(key, float("nan"))
              if val < lo:
                  dead_flags.append((key, val, lo, hi))
                  print(f"  DEAD flag: {key}={val:.4f} < lo={lo:.4f}")
              elif val > hi and key not in UPPER_SKIP:
                  dead_flags.append((key, val, lo, hi))
                  print(f"  DEAD flag (above hi): {key}={val:.4f} > hi={hi:.4f}")

          # Frozen criterion: DR does NOT participate in dead_flags count
          is_dead = dr < DEAD_DR_ABS or len(dead_flags) >= 2
          via = "DR<0.5" if dr < DEAD_DR_ABS else f"cycling-flags({len(dead_flags)})"
          print(f"  dead_flags={len(dead_flags)}  dr={dr:.3f}  is_dead={is_dead}  via={via}")
          assert is_dead, (
              f"UNIT TEST FAIL: aggregate DR trap not caught as DEAD "
              f"(dead_flags={len(dead_flags)}, dr={dr:.3f}). Metrics: {metrics}"
          )
          # Key assertion: if DR > 0.5 (the trap is active), it was caught via cycling flags
          if dr >= DEAD_DR_ABS:
              assert len(dead_flags) >= 2, (
                  f"UNIT TEST FAIL: DR={dr:.3f} > 0.5 but only {len(dead_flags)} cycling flag(s) — "
                  f"instrument would miss this case without cycling-metric DEAD path"
              )
              print("UNIT TEST (b): aggregate DR trap — DEAD via cycling metrics — PASS")
          else:
              print("UNIT TEST (b): aggregate DR trap — DEAD via DR<0.5 path (trap not active, still PASS)")
          EOF

      - name: Gate validation — RT-DESC (orbit 35, expect PASS)
        id: rt_desc
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/gate_validation
          python scripts/series_health.py \
            --terminal ras_tanura --orbit 35 \
            --out diagnostics/gate_validation/rt_desc.json
          echo "RT-DESC exit=$?"
        continue-on-error: true

      - name: Gate validation — Al-Faw stuck-7 (expect DEAD)
        id: alfaw_stuck7
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/series_health.py \
            --terminal al_flaw \
            --tanks af_0,af_2,af_3,af_6,af_7,af_9,af_11 \
            --out diagnostics/gate_validation/alfaw_stuck7.json
          echo "alfaw_stuck7 exit=$?"
        continue-on-error: true

      - name: Validate gate results
        run: |
          python - <<'EOF'
          import json, sys
          desc   = json.load(open("diagnostics/gate_validation/rt_desc.json"))
          stuck7 = json.load(open("diagnostics/gate_validation/alfaw_stuck7.json"))
          print(f"RT-DESC       verdict: {desc['verdict']}   diagnosis: {desc['diagnosis']}")
          print(f"alfaw_stuck7  verdict: {stuck7['verdict']}  diagnosis: {stuck7['diagnosis']}")

          print("\nalfaw_stuck7 metrics:")
          for k, v in stuck7.get("metrics", {}).items():
              flag_mark = " ◄ FLAG" if k in stuck7.get("flags", {}) else ""
              print(f"  {k:<30} {str(v):<14}{flag_mark}")

          # RT-ASC orbit 101 is excluded from gate with note:
          # "ASC-101 passes health-check (alive) but is E1-blind (decoupled) —
          #  canonical example that health-check ≠ informativeness;
          #  informativeness is verified only at step 7 (event-response)."

          ok = (desc["verdict"] == "PASS" and stuck7["diagnosis"] == "DEAD")
          if ok:
              print("\nGATE VALIDATION: PASS — instrument valid")
          else:
              desc_ok  = desc["verdict"] == "PASS"
              stuck_ok = stuck7["diagnosis"] == "DEAD"
              if not desc_ok:
                  print(f"\nGATE FAIL: RT-DESC={desc['verdict']} (expected PASS)")
              if not stuck_ok:
                  print(f"\nGATE FAIL: alfaw_stuck7={stuck7['verdict']}/{stuck7['diagnosis']} (expected FLAG/DEAD)")
                  print("  flags:", json.dumps(stuck7.get("flags", {}), indent=4))
              sys.exit(1)
          EOF

      - name: Run post-validation terminals
        if: success()
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/gate_validation

          # ── standalone terminals ──────────────────────────────────────────
          for terminal in fujairah ras_laffan zirku juwaymah; do
            echo "=== $terminal ==="
            python scripts/series_health.py --terminal $terminal \
              --out diagnostics/gate_validation/${terminal}.json || true
          done

          # ── al_flaw: full / live17 / norm17 / stuck7-ref ─────────────────
          STUCK7="af_0,af_2,af_3,af_6,af_7,af_9,af_11"
          LIVE17="af_1,af_4,af_5,af_8,af_10,af_12,af_13,af_14,af_15,af_16,af_17,af_18,af_19,af_20,af_21,af_22,af_23"

          echo "=== al_flaw full ==="
          python scripts/series_health.py --terminal al_flaw \
            --out diagnostics/gate_validation/alfaw_full.json || true

          echo "=== al_flaw live17 ==="
          python scripts/series_health.py --terminal al_flaw \
            --tanks $LIVE17 \
            --out diagnostics/gate_validation/alfaw_live17.json || true

          echo "=== al_flaw norm17 (live17 on db_norm column) ==="
          python scripts/series_health.py --terminal al_flaw \
            --tanks $LIVE17 --value-column db_norm \
            --out diagnostics/gate_validation/alfaw_norm17.json || true

          echo "=== al_flaw stuck7 (reference) ==="
          python scripts/series_health.py --terminal al_flaw \
            --tanks $STUCK7 \
            --out diagnostics/gate_validation/alfaw_stuck7.json || true

          # ── jask: full + peace-window (2020-01-01 onwards) ───────────────
          echo "=== jask full ==="
          python scripts/series_health.py --terminal jask \
            --out diagnostics/gate_validation/jask.json || true

          echo "=== jask peace-window (–2026-02-28) ==="
          python scripts/series_health.py --terminal jask \
            --to-date 2026-02-28 \
            --out diagnostics/gate_validation/jask_peace.json || true

      - name: Print summary table
        run: |
          python - <<'EOF'
          import json, pathlib
          results_dir = pathlib.Path("diagnostics/gate_validation")

          # Display order
          ORDER = [
              "rt_desc", "alfaw_stuck7",
              "fujairah", "ras_laffan", "zirku", "juwaymah",
              "alfaw_full", "alfaw_live17", "alfaw_norm17",
              "jask", "jask_peace",
          ]

          files = {f.stem: f for f in results_dir.glob("*.json")}
          ordered = [files[k] for k in ORDER if k in files]
          ordered += [v for k, v in sorted(files.items()) if k not in ORDER]

          print("\n=== SERIES_HEALTH SUMMARY ===")
          hdr = f"{'Label':<22} {'Orbit':<6} {'Window':<12} {'Verdict':<8} {'Diagnosis':<8}"
          print(hdr)
          print("-" * 60)
          for f in ordered:
              r = json.load(f.open())
              orb  = str(r.get("relative_orbit") or "all")
              tanks = r.get("tanks")
              fd   = (r.get("from_date") or "")[:7]
              td   = (r.get("to_date")   or "")[:7]
              win  = f"{fd}–" if fd and not td else (f"–{td}" if td and not fd else
                     f"{fd}–{td}" if fd and td else "full")
              n    = f"[{len(tanks)}t]" if tanks else ""
              lbl  = f.stem + n
              print(f"  {lbl:<22} {orb:<6} {win:<12} {r['verdict']:<8} {r.get('diagnosis') or '—'}")

          print("\n=== KEY METRICS (flagged terminals) ===")
          for f in ordered:
              r = json.load(f.open())
              if r["verdict"] != "PASS":
                  print(f"\n  [{f.stem}]  {r['verdict']} / {r.get('diagnosis') or 'REVIEW'}")
                  for k, v in r.get("metrics", {}).items():
                      flag = " ◄" if k in r.get("flags", {}) else ""
                      val  = f"{v:.4f}" if isinstance(v, float) else str(v)
                      print(f"    {k:<30} {val}{flag}")
          EOF

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/SERIES_HEALTH_STANDARD.md diagnostics/gate_validation/ || true
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "ci: series_health corridors + gate validation [skip ci]"
          git push origin claude/oilradar-dashboard-iran-zchdva

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: series-health
          path: |
            diagnostics/SERIES_HEALTH_STANDARD.md
            diagnostics/gate_validation/
