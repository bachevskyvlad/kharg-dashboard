name: Series Health Standard — corridors + gate validation

on:
  workflow_dispatch: {}

jobs:
  series_health_standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase sentinelhub -q

      - name: Stage 1 — compute SERIES_HEALTH_STANDARD corridors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics
          python scripts/series_health_standard.py \
            --out diagnostics/SERIES_HEALTH_STANDARD.md
          echo "=== CORRIDORS ===" && cat diagnostics/SERIES_HEALTH_STANDARD.md

      - name: Gate validation — RT-DESC (orbit 35, expect PASS)
        id: rt_desc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/gate_validation
          python scripts/series_health.py \
            --terminal ras_tanura --orbit 35 \
            --out diagnostics/gate_validation/rt_desc.json
          echo "RT-DESC exit=$?"
        continue-on-error: true

      - name: Gate validation — RT-ASC archive (orbit 101, expect DEAD)
        id: rt_asc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/series_health.py \
            --terminal ras_tanura --orbit 101 \
            --out diagnostics/gate_validation/rt_asc.json
          echo "RT-ASC exit=$?"
        continue-on-error: true

      - name: Validate gate results
        run: |
          python - <<'EOF'
          import json, sys
          desc = json.load(open("diagnostics/gate_validation/rt_desc.json"))
          asc  = json.load(open("diagnostics/gate_validation/rt_asc.json"))
          print(f"RT-DESC verdict: {desc['verdict']}  diagnosis: {desc['diagnosis']}")
          print(f"RT-ASC  verdict: {asc['verdict']}   diagnosis: {asc['diagnosis']}")
          # Print all metric values for RT-ASC for diagnosis
          print("\nRT-ASC metrics:")
          for k, v in asc.get('metrics', {}).items():
              flag_mark = " ◄ FLAG" if k in asc.get('flags', {}) else ""
              print(f"  {k:<30} {str(v):<12}{flag_mark}")
          print("\nRT-ASC flags:", asc.get('flags', {}))
          ok = (desc['verdict'] == 'PASS' and asc['diagnosis'] == 'DEAD')
          if ok:
              print("\nGATE VALIDATION: PASS — instrument valid")
          else:
              print(f"\nGATE VALIDATION: FAIL — RT-DESC={desc['verdict']} RT-ASC={asc['verdict']}/{asc['diagnosis']}")
              sys.exit(1)
          EOF

      - name: Run post-validation terminals
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for terminal in al_flaw juwaymah jask; do
            echo "=== $terminal ==="
            python scripts/series_health.py --terminal $terminal \
              --out diagnostics/gate_validation/${terminal}.json || true
          done

      - name: Print summary table
        run: |
          python - <<'EOF'
          import json, pathlib
          results_dir = pathlib.Path("diagnostics/gate_validation")
          print("\n=== SERIES_HEALTH SUMMARY ===")
          print(f"{'Terminal':<20} {'Orbit':<8} {'Verdict':<8} {'Diagnosis':<10}")
          print("-" * 50)
          for f in sorted(results_dir.glob("*.json")):
              r = json.load(f.open())
              orb = str(r.get('relative_orbit') or 'all')
              print(f"  {r['terminal']:<18} {orb:<8} {r['verdict']:<8} {r.get('diagnosis') or '—':<10}")
          EOF

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/SERIES_HEALTH_STANDARD.md diagnostics/gate_validation/ || true
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "ci: series_health corridors + gate validation [skip ci]"
          git push origin claude/oilradar-dashboard-iran-zchdva

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: series-health
          path: |
            diagnostics/SERIES_HEALTH_STANDARD.md
            diagnostics/gate_validation/
