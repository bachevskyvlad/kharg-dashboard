name: Dardanelles — Sentinel-2 Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub pillow numpy

      - name: Fetch Sentinel-2 images
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/dardanelles_preview.py

      - name: Commit images to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scripts/dardanelles_*.png data/ 2>/dev/null || true
          git add data/dardanelles_*.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add Dardanelles S2 preview images"
          git push origin main
