name: Dardanelles — Sentinel-2 Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub pillow numpy

      - name: Fetch Sentinel-2 images
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/dardanelles_preview.py

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: dardanelles-preview
          path: scripts/dardanelles_*.png
          retention-days: 7
