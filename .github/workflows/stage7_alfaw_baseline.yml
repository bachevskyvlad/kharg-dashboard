name: Stage 7 — Al-Faw Baseline Pipeline

on:
  workflow_dispatch:
    inputs: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas numpy requests Pillow matplotlib scipy -q

      - name: Run Al-Faw baseline pipeline
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python stage7_alfaw_baseline.py

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/al_faw/ IRAQ_ALFAW_BASELINE.md || true
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: stage7 al_faw baseline outputs [skip ci]"
          git pull origin main --rebase || true
          git push origin HEAD:main || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-alfaw-diagnostics
          path: |
            diagnostics/al_faw/iraq_alfaw_daily.csv
            diagnostics/al_faw/iraq_alfaw_pertank.csv
            diagnostics/al_faw/alfaw_geometry.csv
            diagnostics/al_faw/alfaw_s2_scenes.csv
            diagnostics/al_faw/panels/
            diagnostics/al_faw/alfaw_tank_map.png
            diagnostics/al_faw/alfaw_terminal_series.png
            IRAQ_ALFAW_BASELINE.md
