name: Generate Kharg Interactive Viewer

on:
  workflow_dispatch:

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests Pillow
      - name: Generate viewer
        run: python scripts/make_kharg_viewer.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharg-viewer
          path: public/kharg_viewer.html
          retention-days: 7
      - name: Commit to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/kharg_viewer.html
          git diff --cached --quiet || git commit -m "data: Kharg interactive S2 viewer"
          git push
