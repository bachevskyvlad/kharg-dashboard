name: Saudi — Stage 4 RT Curve Compare

on:
  workflow_dispatch:

jobs:
  stage4-rt-curve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet sentinelhub numpy pandas scipy supabase requests matplotlib

      - name: Run RT curve comparison
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/stage4_rt_curve_compare.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/stage4/
          git diff --cached --quiet || git commit -m "stage4: RT/YB curve comparison"
          git push origin claude/oilradar-dashboard-iran-zchdva
