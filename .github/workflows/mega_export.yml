name: Research — Mega Export

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Sections to run (e.g. 1,2,3.3,5,6 or 4 or 3.1,3.2)"
        required: false
        default: "1,2,3.3,5,6"
      terminal:
        description: "Section 4 only: terminal to process (kharg|ras_tanura|yanbu or blank=all)"
        required: false
        default: ""
      orbit:
        description: "Section 4 only: orbit to process (DESC-35|ASC-101|ASC-14 or blank=all)"
        required: false
        default: ""
      resume:
        description: "Section 4 only: skip dates already in part*.csv.gz files (true/false)"
        required: false
        default: "false"
      pack_zip:
        description: "Pack output into mega_part1.zip + esri_crops.zip (true/false)"
        required: false
        default: "false"

jobs:
  mega_export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy pandas scipy matplotlib sentinelhub supabase Pillow requests -q

      - name: Run mega export
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM
        run: |
          mkdir -p diagnostics/mega
          cd scripts
          TERMINAL_ARG=""
          [ -n "${{ github.event.inputs.terminal }}" ] && TERMINAL_ARG="--terminal ${{ github.event.inputs.terminal }}"
          ORBIT_ARG=""
          [ -n "${{ github.event.inputs.orbit }}" ] && ORBIT_ARG="--orbit ${{ github.event.inputs.orbit }}"
          RESUME_ARG=""
          [ "${{ github.event.inputs.resume }}" = "true" ] && RESUME_ARG="--resume"
          PACK_ARG=""
          [ "${{ github.event.inputs.pack_zip }}" = "true" ] && PACK_ARG="--pack-zip"
          python research/mega_export.py \
            --sections "${{ github.event.inputs.sections }}" \
            $TERMINAL_ARG \
            $ORBIT_ARG \
            $RESUME_ARG \
            $PACK_ARG \
            2>&1 | tee ../diagnostics/mega/run_mega_$(date -u +%Y%m%dT%H%M).txt

      - name: Save results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A diagnostics/mega/ diagnostics/mega_part1.zip diagnostics/esri_crops.zip 2>/dev/null || git add -A diagnostics/mega/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "research: mega_export s=${{ github.event.inputs.sections }} t=${{ github.event.inputs.terminal }} o=${{ github.event.inputs.orbit }} r=${{ github.event.inputs.resume }} [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, retrying in ${attempt}s"
            sleep $attempt
          done || true
