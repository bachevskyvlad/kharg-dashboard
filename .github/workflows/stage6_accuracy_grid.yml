name: Stage 6 — Accuracy Grid (manual)

on:
  workflow_dispatch:
    inputs:
      skip_v1:
        description: "Skip V1 fresh-image sweep (use existing mask_label=15m_half)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      skip_stage4:
        description: "Skip locked Stage 4 final correlation"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  accuracy-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check secrets presence
        run: |
          echo "CLIENT_ID set: ${{ secrets.CLIENT_ID != '' }}"
          echo "CLIENT_SECRET set: ${{ secrets.CLIENT_SECRET != '' }}"
          echo "SUPABASE_URL set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_KEY set: ${{ secrets.SUPABASE_KEY != '' }}"

      - name: Run accuracy grid
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          ARGS=""
          if [ "${{ github.event.inputs.skip_v1 }}" = "true" ]; then
            ARGS="$ARGS --skip-v1"
          fi
          if [ "${{ github.event.inputs.skip_stage4 }}" = "true" ]; then
            ARGS="$ARGS --skip-stage4"
          fi
          python stage6_accuracy_grid.py $ARGS

      - name: Upload accuracy grid results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-grid-results
          path: |
            diagnostics/accuracy_grid/accuracy_grid.csv
            diagnostics/accuracy_grid/ACCURACY_GRID.md
          if-no-files-found: warn
