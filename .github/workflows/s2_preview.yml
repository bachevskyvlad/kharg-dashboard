name: Kharg — Sentinel-2 Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sentinelhub pillow numpy

      - name: Fetch Sentinel-2 image
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          cd scripts
          python s2_preview.py

      - name: Commit PNG to repo
        run: |
          cp scripts/kharg_s2_preview.png public/kharg_s2_preview.png
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add public/kharg_s2_preview.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "s2 preview $(date -u +'%Y-%m-%d')"
          git push
