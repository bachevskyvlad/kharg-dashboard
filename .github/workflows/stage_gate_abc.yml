name: Al-Faw Gate A/B/C (SAR geometry arbitration)

on:
  workflow_dispatch:
    inputs: {}

jobs:
  gate_abc:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests Pillow -q

      - name: Run Gate A/B/C
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          python stage_gate_abc.py 2>&1 | tee ../diagnostics/al_faw/gate_abc_run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/gate_abc_results.csv  || true
          git add -f diagnostics/al_faw/gate_abc_verdict.txt  || true
          git add -f diagnostics/al_faw/gate_abc_run.txt      || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: gate A/B/C results [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
