name: Ak-Sai — rev6 I (Landsat cross-calibration frames)

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-brahmagupta-0lzzag]
    paths: [aksay/h_pairs.py, .github/workflows/aksay_landsat_pairs.yml]

permissions:
  contents: write

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy Pillow rasterio -q
      - run: python aksay/h_pairs.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add aksay/data/landsat_pairs/ || true
          git diff --cached --quiet && echo "No new files" || git commit -m "ci: aksay landsat pairs [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*7)); done
