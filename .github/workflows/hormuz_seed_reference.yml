name: Hormuz — Seed from Reference

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = no writes)"
        required: false
        default: "false"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run seed
        env:
          SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_BOT:       ${{ secrets.TG_BOT }}
          TG_CHAT:      ${{ secrets.TG_CHAT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/seed_hormuz_from_reference.py --dry-run
          else
            python scripts/seed_hormuz_from_reference.py --commit
          fi
