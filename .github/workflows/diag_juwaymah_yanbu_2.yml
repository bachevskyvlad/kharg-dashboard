name: Diagnose Round 2 — Juwaymah + Yanbu

on:
  workflow_dispatch:

jobs:
  diagnose2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt matplotlib pillow

      - name: Run Round 2 diagnostic
        run: python scripts/diag_juwaymah_yanbu_2.py --tasks 1,2,3,4,5
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload Juwaymah diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juwaymah-diag2
          path: diagnostics/juwaymah/
          retention-days: 3

      - name: Upload Yanbu diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanbu-diag2
          path: diagnostics/yanbu/
          retention-days: 3

      - name: Upload verdict
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-diag2
          path: |
            diagnostics/DIAGNOSTIC_JUAYMAH_YANBU_2.md
            diagnostics/task1_results.json
            diagnostics/task2_results.json
            diagnostics/task3_results.json
            diagnostics/task4_results.json
          retention-days: 3
