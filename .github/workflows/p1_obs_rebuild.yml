name: Research — P1 observations_all rebuild

on:
  workflow_dispatch: {}

jobs:
  p1_rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests -q

      - name: Rebuild observations_all from prod-DB + CDSE + s4 CSVs
        run: |
          mkdir -p diagnostics/mega
          python scripts/research/p1_obs_rebuild.py \
            2>&1 | tee diagnostics/mega/run_p1_rebuild_$(date -u +%Y%m%dT%H%M).txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit and push results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A diagnostics/mega/observations_all.csv.gz \
                     diagnostics/mega/run_p1_rebuild_*.txt
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "research: p1_obs_rebuild [run ${{ github.run_id }}] [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/2026-10-auto && \
            git rebase -X theirs origin/research/2026-10-auto && \
            git push origin HEAD:research/2026-10-auto && break
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed"
            sleep $attempt
          done || true
