name: Generate Kharg Island GIF (Sentinel-2)

on:
  workflow_dispatch:

jobs:
  gif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests Pillow
      - name: Generate GIF
        run: python scripts/make_kharg_gif.py
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharg-animation
          path: public/kharg_animation.gif
          retention-days: 7
      - name: Commit GIF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/kharg_animation.gif
          git diff --cached --quiet || git commit -m "data: Kharg Island Sentinel-2 animation"
          git push
