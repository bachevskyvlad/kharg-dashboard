name: tz12_3_anchorage_finalize

# ТЗ v2.1 -> base + site: step 2 calibration + sanity, step 3 upsert 325 dates,
# step 4 snapshots, step 6 live check. Runs on research/2026-10-auto.
on:
  workflow_dispatch:
  push:
    branches: [claude/bold-shannon-6c2b8c]
    paths:
      - .github/workflows/tz12_3_anchorage_finalize.yml

concurrency:
  group: tz12-3-anchorage-hist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
      SUPABASE_WRITE_KEY: sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM
      RUN_ID: gha-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/2026-10-auto
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet sentinelhub scipy numpy Pillow matplotlib rasterio shapely requests playwright
      - name: Steps 1-3 — completeness, calibration + sanity, upsert
        run: python diagnostics/anchorage_hist/hist_backfill.py --calibrate
      - name: Step 4 — snapshots
        run: python diagnostics/anchorage_hist/hist_backfill.py --snapshots-refetch
      - name: Step 6 — live check app.oilradar.io/anchorage
        if: always()
        run: |
          python -m playwright install --with-deps chromium >/dev/null
          python diagnostics/anchorage_hist/live_check.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/anchorage_hist/logs/finalize_v21.txt diagnostics/anchorage_hist/logs/live_anchorage.png \
                  diagnostics/anchorage_hist/daily_cal.csv diagnostics/anchorage_hist/ships_cal.csv 2>/dev/null || true
          [ -f data/anchorage_length_calibration.json ] && git add data/anchorage_length_calibration.json
          git commit -qm "tz12.3: v2.1 finalize gha-${{ github.run_id }}" || true
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin research/2026-10-auto && git push -q origin HEAD:research/2026-10-auto && break; sleep $((2**i)); done
