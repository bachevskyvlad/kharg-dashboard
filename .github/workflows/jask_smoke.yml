name: Jask — smoke test jk_11 (SAR + S2 fetch diagnosis)

on:
  workflow_dispatch: {}

jobs:
  jask_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase sentinelhub tifffile Pillow matplotlib requests -q

      - name: Run smoke test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p diagnostics/jask/smoke
          cd scripts
          python jask_smoke.py 2>&1 | tee ../diagnostics/jask/smoke/run.txt
          echo "exit=$?"

      - name: Save smoke output
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/jask/smoke/ || true
          git diff --cached --quiet || git commit -m "ci: jask smoke test output [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true

      - name: Upload smoke output
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jask-smoke
          path: diagnostics/jask/smoke/
