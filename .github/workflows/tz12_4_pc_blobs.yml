name: tz12_4_pc_blobs

# Blob patches -> Supabase anchorage_blobs from Planetary Computer (0 SH PU) + FWHM.
# Stage and warp mode are read from diagnostics/anchorage_hist/pc_stage.txt:
#   line 1: probe | run | fwhm | run+fwhm      line 2: frame | 10m
on:
  workflow_dispatch:
  push:
    branches: [claude/bold-shannon-6c2b8c]
    paths:
      - diagnostics/anchorage_hist/pc_stage.txt

concurrency:
  group: tz12-3-anchorage-hist
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://yoekhkczwdeyauwarsyy.supabase.co
      SUPABASE_WRITE_KEY: sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM
      RUN_ID: gha-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bold-shannon-6c2b8c
          path: dev
      - uses: actions/checkout@v4
        with:
          ref: research/2026-10-auto
          fetch-depth: 0
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy scipy Pillow matplotlib rasterio shapely requests pystac-client planetary-computer sentinelhub
      - name: Stage
        working-directory: research
        run: |
          cp ../dev/diagnostics/anchorage_hist/pc_blobs.py diagnostics/anchorage_hist/
          cp ../dev/diagnostics/anchorage_test/tz12_2_test.py diagnostics/anchorage_test/
          STAGE=$(sed -n 1p ../dev/diagnostics/anchorage_hist/pc_stage.txt)
          export PC_WARP=$(sed -n 2p ../dev/diagnostics/anchorage_hist/pc_stage.txt)
          echo "stage=$STAGE warp=$PC_WARP"
          rc=0
          case "$STAGE" in
            probe) python diagnostics/anchorage_hist/pc_blobs.py --probe || rc=$? ;;
            run)   python diagnostics/anchorage_hist/pc_blobs.py --run || rc=$? ;;
            fwhm)  python diagnostics/anchorage_hist/pc_blobs.py --fwhm || rc=$? ;;
            run+fwhm) python diagnostics/anchorage_hist/pc_blobs.py --run && python diagnostics/anchorage_hist/pc_blobs.py --fwhm || rc=$? ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/anchorage_hist/pc_blobs.py diagnostics/anchorage_test/tz12_2_test.py diagnostics/anchorage_hist/logs/pc_blobs.txt
          [ -f diagnostics/anchorage_hist/blobs_fwhm.csv ] && git add diagnostics/anchorage_hist/blobs_fwhm.csv
          git commit -qm "tz12.4 pc_blobs $STAGE ($PC_WARP) gha-${{ github.run_id }}" || true
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin research/2026-10-auto && git push -q origin HEAD:research/2026-10-auto && break; sleep $((2**i)); done
          exit $rc
