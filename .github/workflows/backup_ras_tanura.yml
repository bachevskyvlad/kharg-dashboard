name: Backup Ras Tanura (Task 0)
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
      - run: pip install supabase -q
      - name: Run backup
        run: python scripts/backup_ras_tanura.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Commit backup files
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add backups/
          git commit -m "ci: ras_tanura pre-rebuild backup [skip ci]" || echo "nothing to commit"
          git push origin claude/oilradar-dashboard-iran-zchdva
