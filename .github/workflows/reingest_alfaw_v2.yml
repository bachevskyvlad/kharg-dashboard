name: Al-Faw re-ingest v2 (gate B radii)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Pass --force to execute live re-ingest (dry-run if empty)"
        required: false
        default: ""

jobs:
  reingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests tifffile -q

      - name: Run re-ingest
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          python reingest_alfaw_v2.py ${{ github.event.inputs.force }} 2>&1 | tee ../diagnostics/al_faw/reingest_v2_run.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/reingest_v2_run.txt        || true
          git add -f diagnostics/al_faw/reingest_dryrun.json       || true
          git add -f diagnostics/al_faw/reingest_v2_backup_pre.csv || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: al-faw reingest v2 outputs [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
