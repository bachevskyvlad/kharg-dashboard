name: RT Decomposition — Stages 0-5 (manual)

on:
  workflow_dispatch:
    inputs:
      skip_asc:
        description: "Skip ASC 101 pilot (Stage 4)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  rt-decomp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check secrets presence
        run: |
          echo "CLIENT_ID: $( [ -n '${{ secrets.CLIENT_ID }}' ] && echo set || echo empty )"
          echo "CLIENT_SECRET: $( [ -n '${{ secrets.CLIENT_SECRET }}' ] && echo set || echo empty )"

      - name: Run RT decomposition (Stages 0–5, no Supabase writes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          cd scripts
          EXTRA=""
          if [ "${{ github.event.inputs.skip_asc }}" = "true" ]; then
            EXTRA="--skip-asc"
          fi
          python task7_rt_decomposition.py $EXTRA

      - name: Print report
        run: cat diagnostics/rt_decomp/RT_DECOMPOSITION.md

      - name: Commit diagnostics output
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Code"
          git add diagnostics/rt_decomp/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "diag: RT decomposition Stages 0-5 — $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi
