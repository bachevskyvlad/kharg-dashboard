name: JW Radius Re-Screen — Stage 1 (manual)

on:
  workflow_dispatch:

jobs:
  jw-rescreen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check secrets presence
        run: |
          echo "CLIENT_ID: $( [ -n '${{ secrets.CLIENT_ID }}' ] && echo set || echo empty )"
          echo "CLIENT_SECRET: $( [ -n '${{ secrets.CLIENT_SECRET }}' ] && echo set || echo empty )"

      - name: Run JW radius-corrected re-screen (Stage 1 — no Supabase writes)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: cd scripts && python stage3_jw_radius_rescreen.py

      - name: Print report
        run: cat diagnostics/stage3_jw_radius/jw_radius_rescreen_report.txt

      - name: Commit diagnostics output
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Code"
          git add diagnostics/stage3_jw_radius/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "diag: JW radius re-screen Stage 1 — $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi
