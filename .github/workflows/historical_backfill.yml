name: Historical Backfill — Kharg SAR 2014-present

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install sentinelhub supabase pandas numpy matplotlib
      - name: Run backfill
        run: python scripts/main_script.py
