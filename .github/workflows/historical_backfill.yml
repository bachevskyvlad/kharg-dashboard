name: Historical Backfill — Kharg SAR 2022-2024

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install sentinelhub supabase pandas numpy
      - name: Run historical backfill
        run: python scripts/backfill_historical.py
