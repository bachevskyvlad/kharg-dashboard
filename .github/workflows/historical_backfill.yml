name: Historical Backfill — Kharg SAR 2014-present

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install sentinelhub supabase pandas numpy matplotlib
      - name: Run backfill
        run: python scripts/main_script.py
      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data_daily.json data/data.json
          git diff --cached --quiet || git commit -m "chore: update data files from SAR backfill [skip ci]"
          git push
