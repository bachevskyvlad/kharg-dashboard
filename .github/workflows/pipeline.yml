name: Pipeline

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run: comma-separated or 'all'. Options: tanks,anchorage,berths,hormuz_queue,gulf_exit,export_static,freshness"
        required: false
        default: "all"
      full_recalc:
        description: "berths: full history recalculation (drop --incremental flag)"
        required: false
        default: "false"
      hormuz_backfill_since:
        description: "hormuz_queue: if set (e.g. 2026-11-03), run --commit --start <date> to catch up missed passes"
        required: false
        default: ""
      gulf_exit_days:
        description: "gulf_exit: number of days to look back (default 14)"
        required: false
        default: "14"

concurrency:
  group: pipeline
  cancel-in-progress: true

jobs:

  # One job, sequential steps on a shared filesystem — no artifacts to merge.
  # Every step uses continue-on-error: true so a failure in one source does
  # not block downstream steps. The freshness step reports the final state.

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            sentinelhub scipy numpy Pillow matplotlib \
            rasterio shapely requests supabase pandas \
            pystac-client planetary-computer pyproj \
            --quiet

      # ── step 1: tanks ─────────────────────────────────────────────────────────
      # Ingest goreh_omid, bahregan, jask (PRODUCT_TERMINALS only); compute
      # terminal_volume_timeseries; export Kharg data.json / data_daily.json.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Ingest (tanks + product terminals)
        id: ingest
        continue-on-error: true
        timeout-minutes: 90
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'tanks')
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/ingest.py

      - name: Compute (Kharg + terminal volumes)
        id: compute
        continue-on-error: true
        timeout-minutes: 30
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'tanks')
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/compute.py

      - name: Export Kharg JSON
        id: export_kharg
        continue-on-error: true
        timeout-minutes: 15
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'tanks')
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export.py

      # ── step 2: anchorage + anchorage_tracks ──────────────────────────────────
      - name: Anchorage update
        id: anchorage
        continue-on-error: true
        timeout-minutes: 120
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'anchorage')
        env:
          CLIENT_ID:          ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:      ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_ID:               gha-${{ github.run_id }}
        run: python diagnostics/anchorage_hist/hist_backfill.py --update

      - name: Anchorage tracks + snapshots
        id: anchorage_tracks
        continue-on-error: true
        timeout-minutes: 30
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'anchorage')
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/anchorage/tracks.py

      # ── step 3: berths ────────────────────────────────────────────────────────
      - name: Berths — build 2026 BG if missing
        id: bg2026
        continue-on-error: true
        timeout-minutes: 15
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths')
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          if [ ! -f diagnostics/berth_v4/bg_v4/bg_o101_east_t_head_2026.npy ]; then
            echo "Building 2026 BG..."
            python scripts/berth_build_bg_2026.py
            git config user.email "pipeline@oilradar.io"
            git config user.name "OilRadar Pipeline"
            git add diagnostics/berth_v4/bg_v4/bg_o101_east_t_head_2026.npy
            git commit -m "auto: build bg_o101_east_t_head_2026.npy [skip ci]"
            git push
          else
            echo "2026 BG present — skip build"
          fi

      - name: Berths — v4 history (CSV only)
        id: berths_history
        continue-on-error: true
        timeout-minutes: 60
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths')
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.full_recalc }}" = "true" ]; then
            python scripts/berth_v4_history.py
          else
            python scripts/berth_v4_history.py --incremental
          fi

      - name: Berths — assert gate
        id: berths_assert
        continue-on-error: true
        timeout-minutes: 5
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths')
        run: python scripts/berth_validate_optics_v4.py

      - name: Berths — DB write
        id: berths_dbwrite
        continue-on-error: true
        timeout-minutes: 10
        if: >
          ((inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths')) &&
          steps.berths_assert.outcome == 'success'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/berth_v4_history.py --write-db

      - name: Berths — snapshots
        id: berths_snapshots
        continue-on-error: true
        timeout-minutes: 15
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths')
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/berth_snapshots.py

      # ── step 4: hormuz_queue ──────────────────────────────────────────────────
      - name: Hormuz queue — 35-day window
        id: hormuz_queue
        continue-on-error: true
        timeout-minutes: 90
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'hormuz_queue')
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          TG_BOT:                  ${{ secrets.TG_BOT }}
          TG_CHAT:                 ${{ secrets.TG_CHAT }}
        run: |
          if [ -n "${{ inputs.hormuz_backfill_since }}" ]; then
            python scripts/hormuz_queue_backfill.py --commit --no-ais --start "${{ inputs.hormuz_backfill_since }}"
          else
            python scripts/hormuz_queue_backfill.py --window 35 --no-ais
          fi

      # ── step 5: gulf_exit ─────────────────────────────────────────────────────
      # Detects corridor + irlane (orbit 93) and jask (orbit 57) directly from
      # Planetary Computer. No frozen CSVs. Upserts to gulf_exit_passes.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Gulf exit detect (corridor + irlane + jask)
        id: gulf_exit
        continue-on-error: true
        timeout-minutes: 90
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'gulf_exit')
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python scripts/gulf_exit_detect.py --days "${{ inputs.gulf_exit_days || '14' }}"

      # ── step 6: export_static ─────────────────────────────────────────────────
      # Always runs: exports terminal JSON files and anchorage.json.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Export terminal JSONs
        id: export_terminals
        continue-on-error: true
        timeout-minutes: 15
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'export_static') ||
          contains(inputs.steps || 'all', 'tanks')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_terminal_json.py

      - name: Export anchorage.json
        id: export_anchorage
        continue-on-error: true
        timeout-minutes: 10
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'export_static') ||
          contains(inputs.steps || 'all', 'anchorage')
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/anchorage/export_static.py

      # ── step 7: freshness ─────────────────────────────────────────────────────
      - name: Freshness check (9 sources vs SLA)
        id: freshness
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_BOT:               ${{ secrets.TG_BOT }}
          TG_CHAT:              ${{ secrets.TG_CHAT }}
        run: python scripts/freshness_check.py --no-fail

      # ── step 8: commit + deploy + notify ──────────────────────────────────────
      - name: Commit data/
        id: commit
        continue-on-error: true
        timeout-minutes: 5
        run: |
          git config user.name  "OilRadar Pipeline"
          git config user.email "pipeline@oilradar.io"
          git add data/ public/
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: pipeline $(date -u +'%Y-%m-%d') [run ${{ github.run_id }}]"
          git pull --rebase --autostash origin main
          git push
          echo "data_changed=true" >> "$GITHUB_OUTPUT"

      - name: Check dashboard integrity
        id: check_site
        continue-on-error: true
        timeout-minutes: 5
        if: steps.commit.outputs.data_changed == 'true'
        run: python3 scripts/check_site.py

      - name: Deploy to Cloudflare
        id: deploy
        continue-on-error: true
        timeout-minutes: 10
        if: steps.commit.outputs.data_changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            API_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            TG_BOT
            TG_CHAT
            NOTIFY_SECRET
            SUPABASE_URL
            SUPABASE_KEY
        env:
          API_SECRET:           ${{ secrets.API_SECRET }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TG_BOT:               ${{ secrets.TG_BOT }}
          TG_CHAT:              ${{ secrets.TG_CHAT }}
          NOTIFY_SECRET:        ${{ secrets.NOTIFY_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}

      - name: Notify Telegram
        id: notify
        if: always()
        timeout-minutes: 5
        env:
          TG_BOT:  ${{ secrets.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          icon() {
            case "$1" in
              success)   printf "✅" ;;
              skipped)   printf "➖" ;;
              *)         printf "❌" ;;
            esac
          }
          TEXT=$(printf '%s ingest  %s compute  %s anchorage  %s berths\n%s hormuz_queue  %s gulf_exit  %s deploy\n\n%s\n%s' \
            "$(icon "${{ steps.ingest.outcome }}")" \
            "$(icon "${{ steps.compute.outcome }}")" \
            "$(icon "${{ steps.anchorage.outcome }}")" \
            "$(icon "${{ steps.berths_dbwrite.outcome }}")" \
            "$(icon "${{ steps.hormuz_queue.outcome }}")" \
            "$(icon "${{ steps.gulf_exit.outcome }}")" \
            "$(icon "${{ steps.deploy.outcome }}")" \
            "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            --data-urlencode text="$TEXT"
