name: Pipeline

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run: 'all' or comma-separated (tanks,anchorage,berths,prices,gas,export_static)"
        required: false
        default: "all"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            sentinelhub numpy pandas scipy matplotlib requests supabase \
            yfinance websockets pyarrow diptest \
            Pillow rasterio shapely \
            pystac-client planetary-computer \
            --quiet

      # ── tanks ────────────────────────────────────────────────────
      - name: tanks — ingest
        id: ingest
        if: >
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'tanks')
        continue-on-error: true
        timeout-minutes: 60
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          set +e
          python scripts/ingest.py
          INGEST_RC=$?
          NEW=$(python3 -c "
          import json
          try:
              s = json.load(open('data/ingest_summary.json'))
              print(sum(v.get('new', 0) for v in s.values()))
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)
          echo "new_dates=$NEW" >> "$GITHUB_OUTPUT"
          exit $INGEST_RC

      - name: tanks — compute
        id: compute
        if: >
          steps.ingest.conclusion == 'success' &&
          steps.ingest.outputs.new_dates != '0' &&
          steps.ingest.outputs.new_dates != ''
        continue-on-error: true
        timeout-minutes: 30
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/compute.py

      - name: tanks — export
        id: export_tanks
        if: steps.compute.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export.py

      - name: tanks — status
        id: tanks_status
        if: always()
        run: |
          if [ "${{ steps.ingest.conclusion }}" = "failure" ] || \
             [ "${{ steps.compute.conclusion }}" = "failure" ] || \
             [ "${{ steps.export_tanks.conclusion }}" = "failure" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.ingest.conclusion }}" = "skipped" ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.ingest.outputs.new_dates }}" = "0" ] || \
               [ "${{ steps.ingest.outputs.new_dates }}" = "" ]; then
            echo "status=no_data" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── anchorage ────────────────────────────────────────────────
      - name: anchorage
        id: anchorage
        if: >
          always() && (
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'anchorage'))
        continue-on-error: true
        timeout-minutes: 120
        env:
          CLIENT_ID:            ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:        ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_ID:               gha-${{ github.run_id }}
        run: python diagnostics/anchorage_hist/hist_backfill.py --update

      # ── berths ───────────────────────────────────────────────────
      - name: berths — build 2026 BG
        id: bg2026
        if: >
          always() && (
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'berths'))
        continue-on-error: true
        timeout-minutes: 30
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: |
          if [ ! -f diagnostics/berth_v4/bg_v4/bg_o101_east_t_head_2026.npy ]; then
            echo "Building 2026 BG..."
            python scripts/berth_build_bg_2026.py
          else
            echo "2026 BG present — skip build"
          fi

      - name: berths — history (full recalc)
        id: berth_history
        if: steps.bg2026.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 60
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
        run: python scripts/berth_v4_history.py

      - name: berths — assert gate
        id: berth_assert
        if: steps.berth_history.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/berth_validate_optics_v4.py

      - name: berths — write DB
        id: berth_dbwrite
        if: steps.berth_assert.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/berth_v4_history.py --write-db

      - name: berths — snapshots
        id: berth_snapshots
        if: steps.berth_dbwrite.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:            ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/berth_snapshots.py

      - name: berths — status
        id: berths_status
        if: always()
        run: |
          if [ "${{ steps.berth_history.conclusion }}" = "failure" ] || \
             [ "${{ steps.berth_assert.conclusion }}" = "failure" ] || \
             [ "${{ steps.berth_dbwrite.conclusion }}" = "failure" ] || \
             [ "${{ steps.berth_snapshots.conclusion }}" = "failure" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.bg2026.conclusion }}" = "skipped" ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── prices ───────────────────────────────────────────────────
      - name: prices
        id: prices
        if: >
          always() && (
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'prices'))
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch_prices.py

      # ── gas ──────────────────────────────────────────────────────
      - name: gas
        id: gas
        if: >
          always() && (
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'gas'))
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch_gas_storage.py

      # ── export_static ────────────────────────────────────────────
      - name: export_static — supabase
        id: export_sb
        if: >
          always() && (
          (inputs.steps || 'all') == 'all' ||
          contains(inputs.steps || 'all', 'export_static'))
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_from_supabase.py

      - name: export_static — terminals
        id: export_terminals
        if: always() && steps.export_sb.conclusion != 'skipped'
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_terminal_json.py

      # ── commit ───────────────────────────────────────────────────
      - name: commit
        id: commit
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name  "pipeline"
          git config user.email "pipeline@oilradar.io"
          git add data/ public/ diagnostics/berth_v4/bg_v4/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            tanks_s="${{ steps.tanks_status.outputs.status || 'skip' }}"
            anchorage_s="${{ steps.anchorage.conclusion || 'skip' }}"
            berths_s="${{ steps.berths_status.outputs.status || 'skip' }}"
            prices_s="${{ steps.prices.conclusion || 'skip' }}"
            gas_s="${{ steps.gas.conclusion || 'skip' }}"
            git commit -m "data: pipeline $(date -u +'%Y-%m-%d') [tanks=$tanks_s anchorage=$anchorage_s berths=$berths_s prices=$prices_s gas=$gas_s]"
            git pull --rebase --autostash origin main
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── deploy ───────────────────────────────────────────────────
      - name: deploy
        id: deploy
        if: always() && steps.commit.outputs.data_changed == 'true'
        timeout-minutes: 10
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:        ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:       ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            API_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            TG_BOT
            TG_CHAT
            NOTIFY_SECRET
            SUPABASE_URL
            SUPABASE_KEY
        env:
          API_SECRET:           ${{ secrets.API_SECRET }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TG_BOT:               ${{ secrets.TG_BOT }}
          TG_CHAT:              ${{ secrets.TG_CHAT }}
          NOTIFY_SECRET:        ${{ secrets.NOTIFY_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}

      # ── notify ───────────────────────────────────────────────────
      - name: notify
        if: always()
        timeout-minutes: 2
        env:
          TG_BOT:  ${{ secrets.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          icon() {
            case "$1" in
              ok|success)    printf "✅" ;;
              no_data)       printf "⚪" ;;
              skip|skipped)  printf "➖" ;;
              *)             printf "❌" ;;
            esac
          }
          tanks_s="${{ steps.tanks_status.outputs.status || 'skip' }}"
          anchorage_s="${{ steps.anchorage.conclusion || 'skip' }}"
          berths_s="${{ steps.berths_status.outputs.status || 'skip' }}"
          prices_s="${{ steps.prices.conclusion || 'skip' }}"
          gas_s="${{ steps.gas.conclusion || 'skip' }}"
          export_sb_s="${{ steps.export_sb.conclusion || 'skip' }}"
          export_t_s="${{ steps.export_terminals.conclusion || 'skip' }}"
          commit_s="${{ steps.commit.outputs.data_changed == 'true' && 'ok' || 'no_data' }}"
          deploy_s="${{ steps.deploy.conclusion || 'skip' }}"
          TEXT=$(printf '🛰 OilRadar Pipeline — %s\n\n%s tanks  %s anchorage  %s berths\n%s prices  %s gas\n%s export_sb  %s export_terminals\n%s commit  %s deploy\n\n%s' \
            "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            "$(icon "$tanks_s")" "$(icon "$anchorage_s")" "$(icon "$berths_s")" \
            "$(icon "$prices_s")" "$(icon "$gas_s")" \
            "$(icon "$export_sb_s")" "$(icon "$export_t_s")" \
            "$(icon "$commit_s")" "$(icon "$deploy_s")" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            --data-urlencode text="$TEXT"
