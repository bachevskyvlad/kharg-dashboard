name: Stage 1 baseline — Ras Tanura v2 (rel=35 DESC, 2017-01-01+)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Write to Supabase (dry-run if unchecked)'
        type: boolean
        default: false
      reset:
        description: 'Wipe checkpoint and restart from scratch'
        type: boolean
        default: false

jobs:
  stage1_ras_tanura_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas sentinelhub supabase shapely -q

      - name: Stage 1 backfill — ras_tanura_v2
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  https://yoekhkczwdeyauwarsyy.supabase.co
          SUPABASE_KEY:  sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM
        run: |
          mkdir -p diagnostics/stage1
          FLAGS=""
          if [ "${{ inputs.commit }}" = "true" ]; then FLAGS="$FLAGS --commit"; fi
          if [ "${{ inputs.reset }}"  = "true" ]; then FLAGS="$FLAGS --reset";  fi
          cd scripts
          python stage1_backfill.py --terminal ras_tanura_v2 $FLAGS 2>&1 | tee ../diagnostics/stage1/ras_tanura_v2_run.txt

      - name: Save checkpoint + diagnostics
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/stage1/ras_tanura_v2_run.txt       || true
          git add -f scripts/.stage1_ckpt_ras_tanura_v2.json        || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: stage1 ras_tanura_v2 — baseline ingest checkpoint [skip ci]"
          git pull --rebase origin claude/oilradar-dashboard-iran-zchdva || true
          git push origin HEAD:claude/oilradar-dashboard-iran-zchdva || true
