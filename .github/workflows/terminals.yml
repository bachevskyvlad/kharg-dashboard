name: Terminal Force Backfill

on:
  workflow_dispatch:
    inputs:
      terminal:
        description: "Terminal id or 'all'"
        required: false
        default: "all"
      force:
        description: "Re-fetch all history from 2014 (use when new tanks added)"
        required: false
        default: "false"

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          ARGS="--terminal ${{ inputs.terminal || 'all' }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python ingest.py $ARGS
