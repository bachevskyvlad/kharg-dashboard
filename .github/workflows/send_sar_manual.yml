name: Send SAR Alert — Manual

on:
  workflow_dispatch:
    inputs:
      pass_date:
        description: 'Pass date YYYY-MM-DD'
        required: true
        default: '2026-08-07'
      vol_current:
        description: 'Current volume (Mb)'
        required: true
        default: '18.984'
      vol_prev:
        description: 'Previous volume (Mb)'
        required: true
        default: '21.183'
      prev_date:
        description: 'Previous pass date'
        required: true
        default: '2026-08-01'
      fill_rate_7d:
        description: 'Fill rate 7d (negative = drawdown)'
        required: true
        default: '-0.3297'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send via Resend API
        run: |
          export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          export PASS_DATE="${{ github.event.inputs.pass_date }}"
          export VOL_CURRENT="${{ github.event.inputs.vol_current }}"
          export VOL_PREV="${{ github.event.inputs.vol_prev }}"
          export PREV_DATE="${{ github.event.inputs.prev_date }}"
          export FILL_RATE_7D="${{ github.event.inputs.fill_rate_7d }}"
          python3 scripts/send_alert_manual.py
