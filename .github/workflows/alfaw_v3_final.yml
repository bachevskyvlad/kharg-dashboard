name: Al-Faw v3 final — series + events + panels + SOMO

on:
  workflow_dispatch:

jobs:
  alfaw_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests Pillow -q

      - name: series_v3 — live-calibrated
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          python series_v3.py --force 2>&1 | tee ../diagnostics/al_faw/series_v3_run.txt

      - name: events_v3 — three series
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python events_v3.py --force 2>&1 | tee ../diagnostics/al_faw/events_v3_run.txt

      - name: stuck_passport
        run: |
          cd scripts
          python stuck_passport.py 2>&1 | tee ../diagnostics/al_faw/stuck_passport.txt

      - name: somo_table
        run: |
          cd scripts
          python somo_table.py 2>&1

      - name: ESRI panels — remaining 19 tanks
        run: |
          mkdir -p diagnostics/al_faw/panels
          cd scripts
          python esri_panels_remaining.py 2>&1 | tee ../diagnostics/al_faw/panels/run.txt

      - name: Commit all outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/iraq_alfaw_daily_v3.csv || true
          git add -f diagnostics/al_faw/iraq_alfaw_pertank_v3.csv || true
          git add -f diagnostics/al_faw/iraq_alfaw_events_v3.csv || true
          git add -f diagnostics/al_faw/series_v3_run.txt || true
          git add -f diagnostics/al_faw/events_v3_run.txt || true
          git add -f diagnostics/al_faw/stuck_passport.txt || true
          git add -f diagnostics/al_faw/iraq_somo_monthly_2017_2026.csv || true
          git add -f diagnostics/al_faw/panels/ || true
          git status --short
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: al_faw v3 final — series + events + panels + SOMO [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
