name: Jask Stage 2 — Screen + Cap Gate

on:
  workflow_dispatch:

jobs:
  jask_stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas supabase -q

      - name: Run Stage 2 screen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/jask
          cd scripts
          python jask_stage2_screen.py 2>&1 | tee ../diagnostics/jask/stage2_run.txt

      - name: Save outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/jask/stage2_screen.json || true
          git add -f diagnostics/jask/JASK_SCREEN.md     || true
          git add -f diagnostics/jask/stage2_run.txt     || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "ci: jask stage2 screen + cap gate [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
