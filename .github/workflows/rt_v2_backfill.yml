name: RT v2 Backfill

on:
  workflow_dispatch:
    inputs:
      orbit:
        description: "Relative orbit number (35 or 101) — or 'all'"
        required: true
        default: "35"
      commit:
        description: "Write to Supabase (true/false)"
        required: false
        default: "false"

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            sentinelhub \
            supabase \
            scipy \
            numpy \
            pandas \
            Pillow \
            shapely

      - name: Run backfill (dry-run or commit)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.orbit }}" = "all" ]; then
            ORBIT_FLAG="--all-orbits"
          else
            ORBIT_FLAG="--orbit ${{ inputs.orbit }}"
          fi

          COMMIT_FLAG=""
          if [ "${{ inputs.commit }}" = "true" ]; then
            COMMIT_FLAG="--commit"
          fi

          python backfill_rt_v2.py $ORBIT_FLAG $COMMIT_FLAG
