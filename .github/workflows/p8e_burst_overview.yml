name: Research — P8e burst overview

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/2026-10-auto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy requests scipy matplotlib

      - name: Run burst overview
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/research/p8e_burst_overview.py

      - name: Commit outputs
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/mega/
          git diff --cached --quiet || git commit -m "diagnostics: p8e burst overview outputs"
          git push origin research/2026-10-auto
