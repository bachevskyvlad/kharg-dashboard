name: Al-Faw retry v2 (error analysis + catalog verify + retry)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "analyze (default) or retry (live upsert of transient failures)"
        required: false
        default: ""

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests tifffile -q

      - name: Run retry/analysis
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p diagnostics/al_faw
          cd scripts
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "--retry" ]; then
            python reingest_alfaw_retry.py --retry 2>&1 | tee ../diagnostics/al_faw/reingest_v2_retry_run.txt
          else
            python reingest_alfaw_retry.py 2>&1 | tee ../diagnostics/al_faw/reingest_v2_retry_run.txt
          fi

      - name: Commit outputs
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnostics/al_faw/reingest_v2_retry_run.txt          || true
          git add -f diagnostics/al_faw/reingest_v2_failed_pairs.csv       || true
          git add -f diagnostics/al_faw/reingest_v2_catalog_report.json    || true
          git status --short
          git diff --cached --quiet && echo "No new files" || \
            git commit -m "ci: al-faw retry v2 outputs [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
