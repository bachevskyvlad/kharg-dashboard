name: Plot Terminal Volumes

on:
  workflow_dispatch:

jobs:
  plot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas matplotlib

      - name: Generate chart
        env:
          SUPABASE_URL: "https://yoekhkczwdeyauwarsyy.supabase.co"
          SUPABASE_KEY: "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
        run: python plot_terminals.py

      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: terminal-volumes-chart
          path: scripts/terminal_volumes.png
          retention-days: 7
