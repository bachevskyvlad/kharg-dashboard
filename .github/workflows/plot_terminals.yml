name: Plot Terminal Volumes

on:
  workflow_dispatch:

jobs:
  plot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase pandas matplotlib

      - name: Generate chart
        env:
          SUPABASE_URL: "https://yoekhkczwdeyauwarsyy.supabase.co"
          SUPABASE_KEY: "sb_publishable_7j07_zzdqTGM1LXf7-o9Tg_JJRbJQSM"
        run: python plot_terminals.py

      - name: Commit chart to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../scripts/terminal_volumes.png
          git diff --cached --quiet || git commit -m "chore: update terminal volumes chart"
          git push origin HEAD:main
