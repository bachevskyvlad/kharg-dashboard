name: Saudi Stage 5 — Decompose

on:
  workflow_dispatch:

jobs:
  decompose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oilradar-dashboard-iran-zchdva
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install sentinelhub supabase numpy pandas matplotlib

      - name: Run stage5_decompose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/stage5_decompose.py

      - name: Run kharg_control
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/kharg_control.py

      - name: Commit diagnostics
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/stage5/
          git diff --cached --quiet || git commit -m "diagnostics: stage5 decompose results"
          git push origin claude/oilradar-dashboard-iran-zchdva
