name: EIA Correlation Analysis

on:
  workflow_dispatch:

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas scipy matplotlib
      - name: Run correlation analysis
        run: python scripts/calibrate_eia.py 2>&1 | tee /tmp/eia_result.txt
      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: eia-correlation-chart
          path: public/eia_correlation.png
      - name: Telegram — results
        if: success()
        run: |
          STATS=$(grep -E "Correlation|months|EIA:|SAR:" /tmp/eia_result.txt | head -10)
          curl -s -X POST "https://api.telegram.org/bot7745904293:AAHV2qN_5_XNxpg6Ir3iV3XmEKpokthi308/sendMessage" \
            -d chat_id="204715787" \
            -d parse_mode="HTML" \
            --data-urlencode text="📊 <b>EIA Correlation Analysis</b>

${STATS}

📎 Chart uploaded as artifact in Actions"
