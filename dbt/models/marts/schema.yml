version: 2

models:
  - name: kharg_daily
    description: Daily Kharg Island storage volume with signals.
    columns:
      - name: date
        tests: [not_null, unique]
      - name: vol_mn_bbl
        tests: [not_null]
      - name: signal
        tests:
          - accepted_values:
              arguments:
                values: ['BUILD', 'DRAWDOWN', 'FLAT']

  - name: kharg_signals
    description: Streak analysis of consecutive BUILD or DRAWDOWN periods.
    columns:
      - name: date
        tests: [not_null, unique]
      - name: signal
        tests:
          - accepted_values:
              arguments:
                values: ['BUILD', 'DRAWDOWN']
